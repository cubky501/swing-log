<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Swing Log</title>
<style>
  :root{
    --bg:#0b0b0b; --card:#1c1c1c; --card-hi:#262626; --line:#333333;
    --turf:#8de055; --turf-dim:#5fa832; --sand:#d3a86a;
    --ink:#f1efe4; --ink-dim:#9aa294; --danger:#c9694f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#0b0b0b;color:var(--ink);font-family:-apple-system,'Hiragino Sans',sans-serif;min-height:100%;}
  /* 文字サイズ設定(PIN変更シートから選べる)。zoomはWebKit(Safari)で古くから安定してサポートされており、
     ページ全体(固定表示のナビバー等も含む)を丸ごと拡大できるため、個々のfont-size指定を
     rem単位に置き換える大掛かりな改修をせずに済む。html要素に掛けることで、position:fixedの
     要素も含めて破綻なく拡大される */
  html.fs-large{zoom:1.15;}
  html.fs-xlarge{zoom:1.3;}
  #root{min-height:100vh;}
  .phone{width:100%;min-height:100vh;background:var(--bg);position:relative;display:block;}
  @media (min-width: 600px) and (max-width: 1024.98px){
    /* iPadなどタブレット幅: スマホ枠は出さず、フル画面のまま読みやすい幅に中央寄せする */
    .topbar, .content, .login-content, .student-select-wrap{max-width:640px;margin-left:auto;margin-right:auto;}
    .navbar, .inputbar, .file-chip{max-width:640px;}
  }
  @media (min-width: 1025px){
    /* デスクトップ幅ではプレビュー用にスマホ枠を再現する */
    #root{display:flex;justify-content:center;padding:24px 12px;}
    .phone{width:390px;max-width:100%;min-height:800px;border-radius:32px;border:8px solid #050704;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden;}
  }
  .statusbar{height:38px;flex:0 0 38px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 6px;font-family:monospace;font-size:12px;color:var(--ink-dim);}
  .screen-wrap{display:block;}
  .topbar{position:sticky;top:0;z-index:6;background:var(--bg);padding:calc(52px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;}
  .eyebrow{font-family:monospace;font-size:11px;letter-spacing:.14em;color:var(--turf);text-transform:uppercase;}
  .h1{font-weight:700;font-size:24px;}
  .sub{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .add-btn{background:var(--turf);color:#0a0d08;border:none;border-radius:999px;font-weight:700;font-size:13px;padding:9px 14px;flex:0 0 auto;}
  .add-btn:disabled{background:var(--card-hi);color:var(--ink-dim);opacity:.6;}
  .student-select-wrap{padding:10px 0 4px;}
  .loc-tab-row{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .loc-tab-label{padding:10px 16px 4px;font-size:11px;font-weight:600;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.03em;}
  .loc-tab-row::-webkit-scrollbar{display:none;}
  .loc-tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink-dim);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap;}
  .loc-tab.on{background:var(--card-hi);border-color:var(--sand);color:var(--sand);}
  .student-search{display:block;width:calc(100% - 32px);margin:0 16px 8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-family:inherit;font-size:13px;}
  .student-search-row{display:flex;gap:8px;align-items:stretch;margin:0 16px 8px;}
  .student-search-row .student-search{flex:1;width:auto;margin:0;}
  .sort-toggle-btn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink-dim);font-size:12px;font-weight:600;padding:0 14px;border-radius:10px;white-space:nowrap;font-family:inherit;}
  .content .student-search-row{margin:0 0 10px;}
  .student-tag-row{display:flex;gap:8px;overflow-x:auto;padding:0 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .lesson-grid{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px;}
  .lesson-chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
  .lesson-chip.on{background:var(--turf);border-color:var(--turf);color:#0a0d08;}
  .lesson-chip .loc-mini{font-size:10px;font-weight:600;color:var(--ink-dim);}
  .lesson-chip.on .loc-mini{color:#0a0d08;opacity:.7;}
  .student-tag-row::-webkit-scrollbar{display:none;}
  .student-tag{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink-dim);font-size:13px;font-weight:600;padding:6px 16px 6px 6px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;}
  .unread-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:0 0 9px;margin-right:-2px;}
  .student-tag-photo{width:26px;height:26px;border-radius:50%;flex:0 0 26px;overflow:hidden;background:var(--card-hi);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sand);}
  .student-tag-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .student-tag.on{background:var(--turf);border-color:var(--turf);color:#0a0d08;}
  .student-tag-empty{padding:0 16px;color:var(--ink-dim);font-size:12px;}

  /* timeline (mypage) */
  .tl{display:flex;flex-direction:column;}
  .tl-item{display:flex;gap:12px;}
  .tl-rail{display:flex;flex-direction:column;align-items:center;width:14px;flex:0 0 14px;}
  .tl-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);margin-top:4px;flex:0 0 11px;}
  .tl-dot.lesson{background:var(--turf);}
  .tl-dot.chat{background:var(--ink-dim);}
  .tl-dot.question{background:var(--sand);}
  .tl-line{flex:1;width:1px;background:var(--line);margin-top:2px;min-height:22px;}
  .tl-body{flex:1;padding-bottom:18px;}
  .tl-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .tl-tag{font-family:monospace;font-size:10px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);}
  .tl-tag.lesson{color:var(--turf);border-color:var(--turf-dim);}
  .tl-tag.chat{color:var(--ink-dim);}
  .tl-tag.question{color:var(--sand);border-color:#6b5636;}
  .tl-thumb-row{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;align-items:center;}
  .tl-thumb-box{position:relative;width:54px;height:54px;border-radius:8px;overflow:hidden;flex:0 0 54px;background:var(--card-hi);border:1px solid var(--line);}
  .tl-thumb-box video{width:100%;height:100%;object-fit:contain;display:block;background:#1a1a1a;}
  .tl-thumb-box .play-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .tl-thumb-box .play-ico svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));}
  .tl-text{font-size:12.5px;line-height:1.6;}
  .tl-dim{color:var(--ink-dim);font-size:11px;}
  .tl-quote{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--ink-dim);border-radius:0 10px 10px 0;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#cdd2c4;}
  .content{padding:14px 16px 100px;}
  .yardage{display:flex;align-items:center;gap:10px;margin:16px 0 10px;font-family:monospace;font-size:11px;color:var(--ink-dim);}
  .yardage .tick{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);}
  .yardage .num{color:var(--sand);}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-dim);font-size:12.5px;line-height:1.8;white-space:pre-line;}

  .login-content{padding:0 22px 24px;display:flex;flex-direction:column;}
  .brand{padding:30px 0 26px;}
  .role-tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:22px;}
  .role-tabs button{flex:1;border:none;background:transparent;color:var(--ink-dim);font-weight:700;font-size:14px;padding:10px;border-radius:9px;}
  .role-tabs button.on{background:var(--turf);color:#0a0d08;}
  .loc-tags{display:flex;gap:8px;}
  .loc-tags .loc-tag{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink-dim);font-weight:700;font-size:13px;padding:10px;border-radius:10px;}
  .loc-tags .loc-tag.on{background:var(--turf);border-color:var(--turf);color:#0a0d08;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-family:monospace;font-size:10.5px;letter-spacing:.06em;color:var(--turf);text-transform:uppercase;margin-bottom:7px;}
  .field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink);font-family:inherit;font-size:14px;outline:none;}
  .field input.pin{font-family:monospace;letter-spacing:.4em;text-align:center;font-size:18px;}
  .hint{font-size:11px;color:var(--ink-dim);margin-top:6px;line-height:1.6;}
  .link-btn{background:none;border:none;padding:0;color:var(--turf);text-decoration:underline;font-family:inherit;font-size:inherit;cursor:pointer;}
  .error-note{font-size:11.5px;color:var(--danger);margin-top:6px;}
  .login-btn{margin-top:6px;background:var(--turf);color:#0a0d08;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:15px;}
  .login-btn:disabled{opacity:.4;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;}
  .card-media{position:relative;aspect-ratio:16/10;background:#1a1a1a;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .media-fallback{color:var(--ink-dim);font-size:11.5px;font-family:monospace;text-align:center;padding:0 20px;line-height:1.8;}
  .card-media img,.card-media video{width:100%;height:100%;object-fit:contain;display:block;background:#1a1a1a;}
  .speed-pill{position:absolute;top:10px;left:10px;display:flex;gap:3px;background:rgba(10,13,9,.72);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:3px;z-index:5;}
  .speed-pill button{border:none;background:transparent;color:var(--ink-dim);font-family:monospace;font-size:10.5px;padding:4px 9px;border-radius:999px;}
  .speed-pill button.on{background:var(--turf);color:#0a0d08;font-weight:700;}
  .club-tag{position:absolute;left:10px;bottom:10px;background:rgba(10,13,9,.72);border:1px solid rgba(255,255,255,.12);color:var(--sand);font-family:monospace;font-size:11px;padding:3px 9px;border-radius:999px;}
  .new-badge{position:absolute;top:10px;right:10px;background:var(--turf);color:#0a0d08;font-family:monospace;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .card-body{padding:13px 14px 15px;}
  .card-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .coach{font-size:13.5px;font-weight:700;}
  .date{font-family:monospace;font-size:11px;color:var(--ink-dim);}
  .comment{font-size:12.5px;line-height:1.65;color:#cdd2c4;}
  .comment .label-mini{color:var(--turf);font-weight:700;font-size:10.5px;letter-spacing:.08em;display:block;margin-bottom:4px;}
  .item-actions{display:flex;gap:12px;margin-top:10px;}
  .item-actions button{background:none;border:none;font-family:monospace;font-size:11px;color:var(--ink-dim);padding:0;}
  .item-actions .item-delete{color:var(--danger);}

  .chat-body{display:flex;flex-direction:column;gap:10px;padding-bottom:160px;background:#0b0b0b;margin:0 -16px;padding-left:16px;padding-right:16px;}
  .day-div{align-self:center;font-family:-apple-system,sans-serif;font-weight:700;font-size:13px;color:#0a0d08;background:var(--turf);padding:6px 16px;border-radius:999px;margin:14px 0 10px;}
  .bubble{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .bubble.coach{background:#3a3d3a;border:none;align-self:flex-start;border-bottom-left-radius:4px;color:#ffffff;}
  .bubble.me{background:var(--turf);border:none;align-self:flex-end;border-bottom-right-radius:4px;color:#0a0d08;}
  .bubble-meta{font-family:-apple-system,sans-serif;font-size:10px;color:#8a8a8a;margin:2px 4px;}
  .bubble-meta.right{align-self:flex-end;}
  .bubble-meta.left{align-self:flex-start;}
  .msg-actions{display:flex;gap:10px;margin:1px 4px 4px;}
  .msg-actions.right{align-self:flex-end;}
  .msg-actions.left{align-self:flex-start;}
  .msg-actions button{background:none;border:none;font-family:monospace;font-size:10px;color:var(--ink-dim);padding:0;}
  .msg-actions .msg-delete{color:var(--danger);}
  .video-bubble{border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;background:#000;max-width:60%;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .video-bubble video{width:100%;display:block;max-height:220px;}
  .video-bubble .pill{position:absolute;bottom:8px;left:8px;background:rgba(10,13,9,.7);color:var(--sand);font-family:monospace;font-size:10px;padding:2px 8px;border-radius:999px;pointer-events:none;}
  .inputbar{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 7px 7px 15px;z-index:8;max-width:358px;margin:0 auto;}
  .inputbar input{flex:1;background:transparent;border:none;color:var(--ink);font-size:13px;outline:none;font-family:inherit;min-width:0;}
  .attach-btn{width:34px;height:34px;border-radius:50%;background:transparent;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 34px;color:var(--sand);position:relative;cursor:pointer;}
  .attach-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .attach-btn.has-file{border-color:var(--sand);}
  .send-btn{width:34px;height:34px;border-radius:50%;background:var(--turf);border:none;display:flex;align-items:center;justify-content:center;flex:0 0 34px;}
  .send-btn:disabled{opacity:.35;}
  .file-chip{position:fixed;bottom:calc(142px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:358px;margin:0 auto;background:var(--card);border:1px solid var(--sand);border-radius:12px;padding:8px 12px;font-size:11.5px;color:var(--sand);display:flex;justify-content:space-between;align-items:center;z-index:8;}
  .file-chip button{background:none;border:none;color:var(--ink-dim);font-size:14px;}

  .kpi-row{display:flex;gap:10px;margin-bottom:4px;}
  .coach-profile-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;}
  .kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .kpi .num{font-size:26px;font-weight:700;color:var(--turf);}
  .kpi .lbl{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}
  .roster-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .roster-name{font-size:15px;font-weight:700;}
  .roster-loc{font-family:monospace;font-size:10px;font-weight:400;color:var(--sand);background:var(--card-hi);padding:1px 7px;border-radius:999px;margin-left:4px;}
  .roster-sub{font-family:monospace;font-size:12px;color:var(--ink-dim);margin-top:3px;}
  .checkin-heatmap{display:flex;gap:3px;margin-top:6px;}
  .checkin-cell{width:11px;height:11px;border-radius:3px;background:var(--card-hi);border:1px solid var(--line);}
  .checkin-cell.on{background:var(--turf);border-color:var(--turf);}
  .roster-actions{display:flex;gap:14px;margin-top:8px;}
  .status-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .status-dot.warn{background:var(--danger);}
  .status-dot.ok{background:var(--turf);}
  .pin-reset-btn{background:none;border:none;font-family:monospace;font-size:11px;color:var(--sand);padding:0;text-align:left;}
  .usage-bar-wrap{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .usage-bar{flex:1;max-width:140px;height:5px;border-radius:999px;background:var(--line);overflow:hidden;}
  .usage-bar-fill{height:100%;background:var(--turf);}
  .usage-bar-fill.over{background:var(--danger);}
  .usage-bar-label{font-family:monospace;font-size:10px;color:var(--ink-dim);}
  .alert-note{color:var(--danger);}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--card-hi);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--sand);flex:0 0 38px;border:1px solid var(--line);overflow:hidden;}
  .avatar-photo{object-fit:cover;width:100%;height:100%;}
  .roster-scores{font-family:monospace;font-size:11px;color:var(--ink-dim);margin-top:2px;}
  .form-photo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--card-hi);border:1px solid var(--line);display:block;margin-bottom:8px;}

  .modal-back{position:fixed;inset:0;background:rgba(6,8,5,.72);display:flex;align-items:flex-end;justify-content:center;z-index:30;}
  .lightbox-inner{position:relative;width:100%;max-width:406px;margin:auto;padding:0 12px;}
  .lightbox-inner video{width:100%;max-height:80vh;border-radius:12px;background:#000;display:block;}
  .lightbox-close{position:absolute;top:-40px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(27,33,26,.9);border:1px solid var(--line);color:var(--ink);font-size:15px;}
  .modal-back.hidden{display:none;}
  .sheet{width:100%;max-width:406px;background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px 22px;max-height:88%;overflow-y:auto;}
  .sheet-title{font-size:19px;font-weight:700;margin-bottom:14px;}
  .usage-note{font-family:monospace;font-size:10.5px;color:var(--sand);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:14px;}
  .issue-tag-row{display:flex;flex-wrap:wrap;gap:6px;}
  .issue-tag{background:var(--card);border:1px solid var(--line);color:var(--ink-dim);font-size:11.5px;padding:6px 12px;border-radius:999px;}
  .issue-tag-positive{border-color:var(--turf);color:var(--turf);}
  .positive-highlight{background:rgba(107,175,58,.12);border:1px solid var(--turf);border-radius:14px;padding:14px;margin-bottom:16px;}
  .positive-highlight-title{font-size:13px;font-weight:700;color:var(--turf);margin-bottom:6px;}
  .positive-highlight-comment{font-size:13.5px;line-height:1.6;color:var(--ink);}
  .positive-highlight-date{font-size:11px;color:var(--ink-dim);margin-top:6px;font-family:monospace;}
  .issue-tag.on{background:var(--turf);border-color:var(--turf);color:#0a0d08;font-weight:700;}
  .issue-badge{font-family:monospace;font-size:10.5px;color:var(--sand);}
  .issue-stats{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .issue-stat-row{display:flex;align-items:center;gap:10px;}
  .issue-stat-label{flex:0 0 76px;font-size:12px;color:var(--ink-dim);}
  .issue-stat-bar{flex:1;height:8px;border-radius:999px;background:var(--card);overflow:hidden;}
  .issue-stat-fill{height:100%;background:var(--turf);}
  .issue-stat-count{flex:0 0 20px;text-align:right;font-family:monospace;font-size:11px;color:var(--ink-dim);}
  .trend-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;line-height:1.6;color:#cdd2c4;}
  .trend-note.good{border-color:var(--turf);color:var(--turf);}
  .trend-note.warn{border-color:var(--danger);color:var(--danger);}
  .ai-summary-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
  .ai-summary-card .hint{margin:2px 0 10px;}
  .ai-summary-body{margin-top:12px;font-size:13px;line-height:1.7;}
  .ai-summary-body h4{color:var(--turf);font-size:12.5px;margin:14px 0 4px;}
  .ai-summary-body h4:first-child{margin-top:0;}
  .ai-summary-body ul,.ai-summary-body ol{margin:0;padding-left:18px;}
  .ai-summary-body li{margin-bottom:6px;}
  .ai-summary-mock-tag{display:inline-block;font-family:monospace;font-size:10px;color:var(--sand);border:1px solid #6b5636;border-radius:999px;padding:2px 8px;margin-bottom:8px;}

<script type="module">

const fbFunctions = getFunctions(fbApp, "asia-northeast1");
// 匿名ログイン自体がハングして(失敗はしないが応答も返ってこない)、リトライが一切働かないまま
// ずっと待ち続けてしまう不具合があったため、1回の試行ごとにも8秒の上限を設ける。
// これで「Wi-Fiは繋がっているのに、なぜか毎回タイムアウトする」という事態を防ぐ
let authReady = withRetry(function(){ return withTimeout(signInAnonymously(auth), 8000); }, 3, 1000).catch(function(e){ console.error("匿名ログイン失敗(3回リトライ後も失敗): ", e); });

  // ===== プッシュ通知(Web Push / FCM) =====
  // Firebaseコンソール → プロジェクト設定 → Cloud Messaging → ウェブ設定 で「鍵ペアを生成」し、
  // 表示されたVAPIDキーをここに設定してください。未設定の間は通知機能はスキップされます。
  var FCM_VAPID_KEY = "BOCBlZA8VKh8VwnqgXWXG9eYSd683XKu2XYQeXnUSdjpAa0_YHXuC9bQy9Km6OUrqZBlDyuRjCS2Ze2WMaNN8Mo";
  var FCM_TOKENS_KEY = "fcm:tokens"; // { "<氏名>": ["token1", "token2", ...] } 1人が複数端末を持てるよう配列で保持
  // チャットの未読バッジ用。「各生徒との最新のやり取り」と「コーチが最後にそのチャットを開いた時刻」を
  // 比較して、生徒からの新着でコーチがまだ見ていないものを未読として扱う
  var CHAT_ACTIVITY_KEY = "chat:latestActivity"; // { "<生徒名>": { lastMessageAt: <ms>, lastFrom: "coach"|"student" } }
  // コーチと管理者(運営)は同じ「スタッフ側」だが、既読管理だけは別々に持つ。
  // 1つのキーを共有すると、管理者が会員のチャットを開いただけでコーチ側も既読(未読バッジ消灯)になってしまい、
  // コーチが実際にはまだ見ていないメッセージを見逃す事故につながるため
  function chatLastReadKeyFor(role){ return role === "admin" ? "admin:chatLastRead" : "coach:chatLastRead"; }

  // iOS Safariは、ホーム画面に追加してそのアイコンから開いた状態(スタンドアロンモード)でないと
  // プッシュ通知の仕組み自体が使えない(2026年時点のApple仕様。通常のSafariタブでは不可)。
  // 判定を誤ると「許可は取れたように見えるのに実際には届かない」という分かりにくい状態になるため、
  // iOSでは明示的にスタンドアロンモードかどうかを確認し、そうでなければボタン自体を出さない
  function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent); }
  function isStandaloneMode(){
    return window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;

  function enableNotifications(myName, onDone){
    if (!notificationsAvailable()) { if (onDone) onDone(new Error("このブラウザ/環境では通知を利用できません")); return; }
    isSupported().then(function(supported){
      if (!supported) { if (onDone) onDone(new Error("このブラウザではFCMがサポートされていません")); return; }
      navigator.serviceWorker.register("/firebase-messaging-sw.js").then(function(reg){
        return Notification.requestPermission().then(function(perm){
          if (perm !== "granted") throw new Error("通知が許可されませんでした");
          var messaging = getMessaging(fbApp);
          return getToken(messaging, { vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });

          // 置き換える方式にすることで、この蓄積を防ぐ(1人が複数端末を使うケースは非対応になるが、
          // 今の運用規模ではこちらを優先する)
          map[myName] = [token];
          setJSON(FCM_TOKENS_KEY, map);
          if (onDone) onDone(null);
        });
      }).catch(function(e){
        console.error("通知の有効化に失敗", e);
        if (onDone) onDone(e);
      });
    });
  }

  // アプリを開いている間(フォアグラウンド)に通知が届いた場合の表示。
  // バックグラウンド時はfirebase-messaging-sw.js側が表示を担当する
  function setupForegroundNotifications(){
    if (!notificationsAvailable()) return;
    isSupported().then(function(supported){
      if (!supported) return;
      var messaging = getMessaging(fbApp);
      onMessage(messaging, function(payload){
        // サーバー側は「notification」ではなく「data」形式で送るように変更した
        var title = (payload.data && payload.data.title) || "Swing Log";
        var body = (payload.data && payload.data.body) || "";
        if (Notification.permission === "granted") {
          try { new Notification(title, { body: body, icon: "/icon.png" }); } catch (e) { alert(title + "\n" + body); }
        }
      });
    });
  }

  var USERS_KEY = "auth:users";
  var STUDENTS_KEY = "coach:students";
  var STORAGE_USAGE_KEY = "storage:usage"; // { studentName: 使用バイト数 }
  var COACH_NAME = "平山 晶彦"; // プロフィール未設定時のデフォルト表示名
  var COACH_PROFILE_KEY = "coach:profile"; // { name, photoUrl } コーチ自身のプロフィール(将来の担当コーチ交代に対応)
  var coachProfileCache = null;
  function getCoachProfile(cb){
    if (coachProfileCache) { cb(coachProfileCache); return; }
    getJSON(COACH_PROFILE_KEY, null, function(p){
      coachProfileCache = { name: (p && p.name) || COACH_NAME, photoUrl: (p && p.photoUrl) || null };
      cb(coachProfileCache);
    });
  }
  function invalidateCoachProfileCache(){ coachProfileCache = null; }
  var COACH_LAST_NAME = "平山";
  var COACH_FIRST_NAME = "晶彦";

  // 姓・名を分けて入力するようになったことで、以前スペースなし等の別表記(あるいは姓のみ)で
  // 保存されていた生徒データが「見つからない」ことにならないよう、

  function normalizeName(s){

  }

  function migrateStudentName(oldName, newName, done){
    getFreshJSON(studentDocKey(oldName), null, function(oldStudentDoc){
      getFreshJSON(studentDocKey(newName), null, function(existingNewDoc){
        var mergedStudent = oldStudentDoc

        getFreshJSON(USERS_KEY, {}, function(users){
          var newUsers = Object.assign({}, users);

          getFreshJSON(STORAGE_USAGE_KEY, {}, function(usageMap){
            var newUsage = Object.assign({}, usageMap);
            if (newUsage[oldName] !== undefined && newUsage[newName] === undefined) {

            getFreshJSON(chatKeyFor(oldName), [], function(chatData){
              getFreshJSON(lessonsKeyFor(oldName), [], function(lessonData){

                  var entries = [
                    { key: USERS_KEY, value: newUsers },
                    { key: STORAGE_USAGE_KEY, value: newUsage },
                    { key: chatKeyFor(newName), value: chatData },
                    { key: lessonsKeyFor(newName), value: lessonData }
                  ];
                  if (lessonPlanData) entries.push({ key: lessonPlanKeyFor(newName), value: lessonPlanData });
                  if (mergedStudent) entries.push({ key: studentDocKey(newName), value: mergedStudent });
                  setJSONBatch(entries, function(){
                    if (mergedStudent) invalidateStudentsListCache();
                    if (mergedStudent && oldName !== newName) {

                      // 存在してしまうので、移行が終わった旧名前側のドキュメントは片付けておく
                      deleteJSONKey(studentDocKey(oldName), function(){
                        deleteJSONKey(chatKeyFor(oldName), function(){
                          deleteJSONKey(lessonsKeyFor(oldName), function(){
                            if (lessonPlanData) {
                              deleteJSONKey(lessonPlanKeyFor(oldName), function(){ if (done) done(); });

                            }

                        });
                      });

                      done();
                    }
                  });
                });
              });
            });
          });
        });
      });
    });
  }

  //
  // 注: ログイン時の自動呼び出しは廃止した(STUDENTS_KEYを毎回読み書きすることで

  var COACH_PIN_KEY = "__coach__";

  var warmedKeys = {}; // 生徒切り替えをテキパキさせるため、一度先読みキューに入れたキーを覚えておく(重複プリフェッチ防止)
  function warmCache(key, delay){
    if (warmedKeys[key]) return;

  function sanitizeKey(key){ return key.replace(/[\/]/g, "_"); }

  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var timer = setTimeout(function(){ reject(new Error("TIMEOUT")); }, ms);
      promise.then(function(v){ clearTimeout(timer); resolve(v); }, function(e){ clearTimeout(timer); reject(e); });

  // promiseFactory は呼ぶたびに新しい試行(新しいFirestore呼び出し)を開始する関数にすること
  function withRetry(promiseFactory, retries, baseDelayMs){

    baseDelayMs = baseDelayMs == null ? 700 : baseDelayMs;
    function attempt(n){
      return promiseFactory().catch(function(e){
        if (n >= retries) throw e;
        return new Promise(function(resolve){ setTimeout(resolve, baseDelayMs * Math.pow(2, n)); })
          .then(function(){ return attempt(n + 1); });
      });
    }
    return attempt(0);
  }

  // cb はキャッシュがあれば同期的に(即座に)呼ばれる。onFresh はサーバーから最新データが
  // 届いた時に呼ばれ、キャッシュと内容が違えば画面を更新するために使う。
  function getJSON(key, fallback, cb, onError, onFresh){
    if (dataCache[key] !== undefined) {
      cb(JSON.parse(JSON.stringify(dataCache[key])));
    }
    var hadCache = dataCache[key] !== undefined;
    withTimeout(authReady, 8000).then(function(){
      withRetry(function(){ return withTimeout(getDoc(doc(db, "appState", sanitizeKey(key))), 8000); }).then(function(snap){
        var value = (snap.exists() && snap.data().value !== undefined)
          ? (function(){ try { return JSON.parse(snap.data().value); } catch (e) { return fallback; } })()
          : fallback;
        var changed = JSON.stringify(dataCache[key]) !== JSON.stringify(value);
        dataCache[key] = value;
        if (!hadCache) cb(JSON.parse(JSON.stringify(value)));
        else if (changed && onFresh) onFresh(JSON.parse(JSON.stringify(value)));
      }).catch(function(e){
        console.error("読み込み失敗", key, e);
        if (!hadCache) { if (onError) onError(e); else cb(fallback); }
      });
    }).catch(function(e){
      console.error("認証エラー", e);
      if (!hadCache) { if (onError) onError(e); else cb(fallback); }
    });
  }
  // キャッシュを無視して、必ずFirestoreへ読みに行った上でcbを呼ぶ。
  // 複数生徒分を1つのドキュメントにまとめて保存しているSTUDENTS_KEY等を
  // 読み込んでから書き戻す(read-modify-write)場合、古いキャッシュのまま書き戻すと
  // 他で追加された生徒データを消してしまう恐れがあるため、そうした処理の直前に使う
  function getFreshJSON(key, fallback, cb, onError){
    withTimeout(authReady, 8000).then(function(){
      withRetry(function(){ return withTimeout(getDoc(doc(db, "appState", sanitizeKey(key))), 8000); }).then(function(snap){
        var value = (snap.exists() && snap.data().value !== undefined)
          ? (function(){ try { return JSON.parse(snap.data().value); } catch (e) { return fallback; } })()
          : fallback;
        dataCache[key] = value;
        cb(JSON.parse(JSON.stringify(value)));
      }).catch(function(e){
        console.error("読み込み失敗", key, e);
        if (onError) onError(e); else cb(fallback);
      });
    }).catch(function(e){
      console.error("認証エラー", e);
      if (onError) onError(e); else cb(fallback);
    });
  }
  function setJSON(key, value){
    dataCache[key] = value; // 即座にキャッシュへ反映(保存完了を待たない)
    authReady.then(function(){
      return withRetry(function(){ return setDoc(doc(db, "appState", sanitizeKey(key)), { value: JSON.stringify(value) }); });
    }).catch(function(e){ console.error("保存失敗", key, e); });
  }
  // 複数キーをまとめて1回のFirestoreバッチコミットで書き込む。
  // サンプル生成のように多数のドキュメントを一気に書く場合、setJSON()を並列に何度も呼ぶと
  // 同時接続が増えて直後の読み込み(ログイン時のPIN照合など)がタイムアウトしやすくなるため、
  // writeBatch()でまとめて1回のネットワーク往復にする。
  // entries: [{key, value}, ...] / done(err) はコミット完了後(失敗時はerrを渡す)に呼ばれる
  function setJSONBatch(entries, done){
    entries.forEach(function(e){ dataCache[e.key] = e.value; }); // 即座にキャッシュへ反映
    authReady.then(function(){
      return withRetry(function(){
        var batch = writeBatch(db);
        entries.forEach(function(e){
          batch.set(doc(db, "appState", sanitizeKey(e.key)), { value: JSON.stringify(e.value) });
        });
        return batch.commit();
      });
    }).then(function(){
      if (done) done(null);
    }).catch(function(e){
      console.error("バッチ保存失敗", e);
      if (done) done(e);
    });
  }
  function deleteJSONKey(key, done){
    delete dataCache[key];
    authReady.then(function(){
      return withRetry(function(){ return deleteDoc(doc(db, "appState", sanitizeKey(key))); });
    }).then(function(){
      if (done) done(null);
    }).catch(function(e){
      console.error("削除失敗", key, e);
      if (done) done(e);
    });
  }

  // 以前は全生徒をまとめて1つのドキュメント(STUDENTS_KEY)の配列として保存していたが、
  // 同時に複数の書き込み(ログイン・登録など)が起きると、後勝ちの上書きで他の生徒が
  // 消えてしまう事故が繰り返し発生していた。これを構造的に無くすため、生徒ごとに
  // 独立したドキュメント("student:<氏名>")として保存する方式に変更した。

  function studentDocKey(name){ return "student:" + name; }

  // アプリ側で絞り込む。範囲検索(where + orderBy on documentId)は環境によって挙動が
  // 不安定だったため、より確実なこの方式に変更した。データ件数は少ないので性能上も問題ない
  function listAllStudents(cb, onError){
    if (studentsListCache) { cb(studentsListCache); return; }
    withTimeout(authReady, 8000).catch(function(){
      // ここで失敗するのはログイン処理自体が詰まった場合。データ取得(次のステップ)の

      throw new Error("AUTH_TIMEOUT");
    }).then(function(){

    }).then(function(snap){
      var list = [];

      snap.forEach(function(docSnap){

        } catch (e) { /* 壊れたドキュメントはスキップ */ }
      });

      // リクエストにまだ間に合っておらず、権限エラー等で結果が空になってしまった一時的な不具合」の

      // ずっと「会員が0人」の画面から復帰できなくなってしまう
      if (list.length > 0) studentsListCache = list;
      cb(list);
    }).catch(function(e){

    });
  }

    var getUploadUrl = httpsCallable(fbFunctions, "getR2UploadUrl");
    getUploadUrl({ pathPrefix: pathPrefix, fileName: file.name, contentType: file.type || "application/octet-stream" })
      .catch(function(e){ e._stage = "getUploadUrl"; throw e; })
      .then(function(res){
        var data = res.data;
        return fetch(data.uploadUrl, {
          method: "PUT",
          headers: { "Content-Type": file.type || "application/octet-stream" },
          body: file
        }).catch(function(e){ e._stage = "R2へのPUT(通信自体が失敗/CORS等)"; throw e; })
          .then(function(putRes){
            if (!putRes.ok) {
              var err = new Error("R2アップロード失敗: HTTPステータス " + putRes.status);
              err._stage = "R2へのPUT(サーバーがエラーを返した)";
              throw err;
            }
            cb(data.publicUrl);
          });
      })
      .catch(function(e){
        console.error("動画アップロード失敗", e);

        if (onError) onError(e);

  function deleteUploadedFile(url){
    if (!url || String(url).indexOf(R2_PUBLIC_BASE_URL) !== 0) return;

  }

  // 実際の日付同士の差分で「最後のログインから何日経ったか」を計算する(以前は配列の並びだけで
  // 判定しており、一度ログインすると欠席日があっても常に「本日ログイン」になってしまうバグがあった)
  function daysSinceLastCheckin(lastCheckinDate){
    if (!lastCheckinDate) return Infinity;
    var last = new Date(lastCheckinDate + "T00:00:00Z");
    var today = new Date(todayKey() + "T00:00:00Z");
    return Math.round((today - last) / 86400000);
  }
  // 直近14日間、その日にログインしていれば埋め、していなければ空、というミニヒートマップ用データを作る
  function recentCheckinDays(checkinDates){
    var set = {};
    (checkinDates || []).forEach(function(d){ if (typeof d === "string") set[d] = true; });

      d.setUTCDate(d.getUTCDate() - i);

      days.push({ key: key, active: !!set[key] });

  }

  /* ---- ふりがな(ひらがな)まわり ----
     生徒の並び替え・検索に使う。カタカナで入力された場合は自動でひらがなに変換し、
     それ以外の文字(漢字・英数字など)が混ざっている場合は無効な入力として扱う。 */
  function katakanaToHiragana(s){
    return String(s || "").replace(/[\u30a1-\u30f6]/g, function(c){
      return String.fromCharCode(c.charCodeAt(0) - 0x60);
    });
  }
  function normalizeKana(s){
    // 全角スペース→半角、前後の空白を除去したうえでカタカナをひらがなに変換
    return katakanaToHiragana(String(s || "").replace(/\u3000/g, " ").trim());
  }
  function isValidHiragana(s){
    if (!s) return true; // 未入力は許容(必須にはしない)

    return /^[\u3041-\u3096\u309d\u309e\u30fc\u30fb\s]+$/.test(s);
  }

  function compareStudentsByKana(a, b, dir){
    var ka = studentKanaKey(a), kb = studentKanaKey(b);
    var aEmpty = ka === "", bEmpty = kb === "";
    if (aEmpty && bEmpty) return 0;
    if (aEmpty) return 1;  // 未設定は常に末尾
    if (bEmpty) return -1;
    var cmp = ka < kb ? -1 : (ka > kb ? 1 : 0);
    return dir === "desc" ? -cmp : cmp;
  }

      return bytes.map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
    });
  }

      var count = 0;
      ISSUE_TAG_KEYWORDS[cat].forEach(function(kw){
        var m = comment.match(new RegExp(kw, "g"));
        if (m) count += m.length;
      });
      if (count > bestCount) { bestCount = count; best = cat; }
    });
    if (best) return best;
    var positiveHit = POSITIVE_KEYWORDS.some(function(kw){ return comment.indexOf(kw) !== -1; });
    if (positiveHit) return POSITIVE_TAG;
    return "その他";
  }

  function renderLogin(){

            : '<div class="hint" style="margin:0 0 14px;">運営(管理者)用のログインです。会員管理・レッスンノート・チャットなど、コーチと同じ内容が確認できます。チャットへの投稿等は「運営」名義で記録されます。</div>') +

        '</div>' +

    document.getElementById("tab-student").onclick = function(){ st.tab = "student"; st.error = ""; renderLogin(); };
    document.getElementById("tab-coach").onclick = function(){ st.tab = "coach"; st.error = ""; renderLogin(); };
    document.getElementById("tab-admin").onclick = function(){ st.tab = "admin"; st.error = ""; renderLogin(); };
    var lastNameInput = document.getElementById("lastname-input");

    var firstNameInput = document.getElementById("firstname-input");

    }
    var pinInput = document.getElementById("pin-input");
    pinInput.oninput = function(e){ st.pin = e.target.value.replace(/\D/g, "").slice(0, 4); e.target.value = st.pin; renderLoginButtonOnly(st); };

  function renderLoginButtonOnly(st){
    var btn = document.getElementById("login-btn");
    if (btn) btn.disabled = !(st.pin.length === 4 && (st.tab !== "student" || (st.lastName.trim().length > 0 && st.firstName.trim().length > 0)));
  }
  function doLogin(st){
    var fullName = (st.lastName.trim() + " " + st.firstName.trim()).trim();
    if (!(st.pin.length === 4 && (st.tab !== "student" || fullName.length > 0))) return;
    st.busy = true;
    var btn = document.getElementById("login-btn");
    if (btn) { btn.disabled = true; btn.textContent = "サーバーに接続中…"; }

    function proceedWithName(resolvedName){
      // PIN照合用のUSERS_KEYと、生徒ドキュメントの読み込みは互いに依存しないため、
      // 順番に待たず並列に取得することでログインの体感速度を上げる
      var usersData = null, usersLoaded = false, usersErr = null;
      var studentDoc = null, studentLoaded = (st.tab !== "student");

      function tryProceed(){
        if (!usersLoaded || !studentLoaded) return;
        if (usersErr) {
          st.busy = false;
          var detail = (usersErr && (usersErr.code || usersErr.message)) ? String(usersErr.code || usersErr.message) : "不明なエラー";
          st.error = "接続エラー: " + detail;
          renderLogin();
          return;
        }
        var users = usersData;
        var key = st.tab === "coach" ? COACH_PIN_KEY : st.tab === "admin" ? ADMIN_PIN_KEY : resolvedName;
        function proceed(){
          if (st.tab === "student") {
            recordCheckin(resolvedName, function(){
              session = { role: "student", name: resolvedName };
              saveSession(session);
              tab = "mypage";
              renderLogin.state = null;
              render();
            }, st.location, studentDoc);
          } else if (st.tab === "admin") {
            session = { role: "admin", name: "運営" };
            saveSession(session);
            tab = "lesson";
            renderLogin.state = null;
            render();
          } else {
            session = { role: "coach", name: COACH_NAME };
            saveSession(session);
            tab = "lesson";
            renderLogin.state = null;
            render();
          }
        }
        hashPin(st.pin).then(function(hashed){
          if (users[key] === undefined) {
            users[key] = hashed;
            setJSON(USERS_KEY, users);
            proceed();
          } else if (users[key] === hashed) {
            proceed();
          } else if (users[key] === st.pin) {
            // 旧・平文保存からの移行
            users[key] = hashed;
            setJSON(USERS_KEY, users);
            proceed();
          } else {
            st.busy = false;
            st.error = "PINが違います。もう一度入力してください。";
            renderLogin();
          }
        });
      }

      getJSON(USERS_KEY, {}, function(users){
        usersData = users; usersLoaded = true; tryProceed();
      }, function(e){
        usersErr = e; usersLoaded = true; tryProceed();
      });
      if (st.tab === "student") {
        getFreshJSON(studentDocKey(resolvedName), null, function(s){
          studentDoc = s; studentLoaded = true; tryProceed();
        });
      }
    }

    proceedWithName(fullName);
  }
  // 選択中の生徒は、タブ切り替え程度では消えないが、ブラウザの再読み込み(スリープからの復帰・
  // アプリ切り替え・プルダウン更新など)でJS側のメモリが初期化されると先頭の生徒に戻ってしまい
  // 使いづらいとの指摘があったため、localStorageに保存して再読み込み後も選択状態を復元する
  var SELECTED_STUDENT_STORAGE_KEY = "swing-log:coachSelectedStudent";
  var coachSelectedStudent = (function(){
    try { return localStorage.getItem(SELECTED_STUDENT_STORAGE_KEY) || null; } catch (e) { return null; }
  })(); // コーチが今見ている生徒名
  function setCoachSelectedStudent(name){
    coachSelectedStudent = name;
    try {
      if (name) localStorage.setItem(SELECTED_STUDENT_STORAGE_KEY, name);
      else localStorage.removeItem(SELECTED_STUDENT_STORAGE_KEY);
    } catch (e) { /* 無視 */ }
  }

  function lessonsKeyFor(name){ return "lesson-feed:entries:" + name; }
  function chatKeyFor(name){ return "chat:messages:" + name; }
  function lessonPlanKeyFor(name){ return "lesson-plan:" + name; }

  var coachSelectedLocation = null; // null = 全教室
  var coachStudentSearch = "";
  var coachSortDir = "asc"; // 生徒一覧のふりがなソート方向。マイページ/ノート/チャット/生徒管理で共有
  var coachRosterSearch = ""; // 生徒管理画面専用の検索キーワード

  // ===== 今回のレッスン生徒(最大3名)=====
  // 平山さんは1日5回前後レッスンをするが、1回のレッスンあたりの対象は最大3名とのことなので、
  // 50名の中から「今このレッスンで見ている生徒」だけにサッと絞り込めるようにする。
  // 日付ではなく、レッスンの区切りごとに手動でリセットする運用(次のレッスンに移る時に「リセット」を押す)
  var CURRENT_LESSON_STORAGE_KEY = "swing-log:currentLessonStudents";
  var CURRENT_LESSON_MAX = 20;
  function getCurrentLessonStudents(){
    try {
      var raw = localStorage.getItem(CURRENT_LESSON_STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    } catch (e) { /* 無視 */ }
    return [];
  }
  function setCurrentLessonStudents(names){
    try { localStorage.setItem(CURRENT_LESSON_STORAGE_KEY, JSON.stringify(names)); } catch (e) { /* 無視 */ }
  }
  var coachLessonFilterActive = false; // 「レッスン中」タブが選択されているか

  // コーチ画面向け:教室タブ→検索→生徒タグ、の2段階セレクターを生成する
  function withStudentScope(container, screenTitle, renderBody){
    if (!isStaff()) {
      renderBody(container, session.name);
      return;
    }
    // 初回ログイン直後などキャッシュが無い状態だと、Firestoreからの読み込みが終わるまで
    // 画面が真っ白に見えてしまうため、先に読み込み中の表示を出しておく
    container.innerHTML = '<div class="content"><div class="empty">読み込み中…</div></div>';
    listAllStudents(function(students){
      if (students.length === 0) {
        container.innerHTML = '<div class="topbar"><div><div class="eyebrow">' + esc(screenTitle) + '</div><div class="h1">会員が未登録</div></div></div>' +
          '<div class="content"><div class="empty">まだ会員がログインしていません。\n会員がログインすると、ここで選べるようになります。</div></div>';
        return;
      }

      var locations = LOCATIONS.slice();
      students.forEach(function(s){ if (s.location && locations.indexOf(s.location) === -1) locations.push(s.location); });
      var hasUnassigned = students.some(function(s){ return !s.location; });

      var filtered = students.filter(function(s){
        if (coachLessonFilterActive) {
          var lessonNames = getCurrentLessonStudents();
          if (lessonNames.indexOf(s.name) === -1) return false;
        }
        if (coachSelectedLocation === "__none__") { if (s.location) return false; }
        else if (coachSelectedLocation && (s.location || "") !== coachSelectedLocation) return false;
        if (coachStudentSearch) {
          var kanaNorm = normalizeKana(coachStudentSearch);
          var nameHit = s.name.indexOf(coachStudentSearch) !== -1;
          var kanaHit = kanaNorm && s.kana && s.kana.indexOf(kanaNorm) !== -1;
          if (!nameHit && !kanaHit) return false;
        }
        return true;
      });
      filtered = sortStudentsByKana(filtered, coachSortDir);

      if (!coachSelectedStudent || !filtered.some(function(s){ return s.name === coachSelectedStudent; })) {
        setCoachSelectedStudent(filtered.length > 0 ? filtered[0].name : null);
      }

      var lessonCount2 = getCurrentLessonStudents().length;
      var locTabsHtml = '<button type="button" class="loc-tab' + (!coachSelectedLocation && !coachLessonFilterActive ? " on" : "") + '" data-loc="">全員</button>' +
        (lessonCount2 > 0 ? '<button type="button" class="loc-tab lesson-tab' + (coachLessonFilterActive ? " on" : "") + '" data-lesson-filter="1">レッスン中(' + lessonCount2 + ')</button>' : "") +
        locations.map(function(loc){ return '<button type="button" class="loc-tab' + (!coachLessonFilterActive && coachSelectedLocation === loc ? " on" : "") + '" data-loc="' + esc(loc) + '">' + esc(loc) + '</button>'; }).join("") +
        (hasUnassigned ? '<button type="button" class="loc-tab' + (!coachLessonFilterActive && coachSelectedLocation === "__none__" ? " on" : "") + '" data-loc="__none__">未設定</button>' : "");

      // チャット画面の生徒一覧だけ、未読(生徒からの新着で、コーチがまだそのチャットを開いていない)を
      // 示すバッジを出す。マイページ・レッスンノート画面では不要なので取得自体をスキップする
      function buildSelectorAndFinish(unreadSet){
        var tagListHtml = filtered.length === 0
          ? '<div class="student-tag-empty">該当する会員がいません</div>'
          : filtered.map(function(s){
              var thumb = s.photoUrl
                ? '<span class="student-tag-photo"><img src="' + esc(s.photoUrl) + '"></span>'
                : '<span class="student-tag-photo student-tag-initial">' + esc(s.name[0]) + '</span>';
              var unreadDot = (unreadSet && unreadSet[s.name]) ? '<span class="unread-dot"></span>' : '';
              return '<button type="button" class="student-tag' + (s.name === coachSelectedStudent ? " on" : "") + '" data-name="' + esc(s.name) + '">' + unreadDot + thumb + esc(s.name) + '</button>';
            }).join("");

        var selectorHtml = '<div class="student-select-wrap">' +
          '<div class="loc-tab-label">教室で絞り込み</div>' +
          '<div class="loc-tab-row">' + locTabsHtml + '</div>' +
          '<div class="student-search-row">' +
            '<input type="text" class="student-search" id="student-search" placeholder="会員名・ふりがなで検索" value="' + esc(coachStudentSearch) + '">' +
            '<button type="button" id="student-sort-toggle" class="sort-toggle-btn" title="あいうえお順の並び替え">' + (coachSortDir === "asc" ? "あ→ん" : "ん→あ") + '</button>' +
          '</div>' +
          '<div class="student-tag-row">' + tagListHtml + '</div>' +
        '</div>';
        finishWithStudentScope(selectorHtml);
      }

      if (screenTitle === "Chat") {
        getJSON(CHAT_ACTIVITY_KEY, {}, function(activity){
          getJSON(chatLastReadKeyFor(session.role), {}, function(lastRead){
            var unreadSet = {};
            filtered.forEach(function(s){
              var a = activity[s.name];
              if (a && a.lastFrom === "student" && (!lastRead[s.name] || a.lastMessageAt > lastRead[s.name])) {
                unreadSet[s.name] = true;
              }
            });
            buildSelectorAndFinish(unreadSet);
          });
        });
      } else {
        buildSelectorAndFinish(null);
      }
      return; // finishWithStudentScope側で後続処理を行うため、ここで一旦抜ける

      function finishWithStudentScope(selectorHtml){

      // 生徒切り替えをテキパキさせるため、表示中の候補(最大20名)のチャット/レッスン/生徒情報を
      // バックグラウンドで先読みしておく(取得済みキーは再取得しない)
      filtered.slice(0, 20).forEach(function(s, wi){
        if (s.name === coachSelectedStudent) return; // 選択中の生徒は通常フローで取得される
        warmCache(chatKeyFor(s.name), wi * 80);
        warmCache(lessonsKeyFor(s.name), wi * 80 + 40);
        warmCache(studentDocKey(s.name), wi * 80 + 20);
      });

      // 生徒を素早く切り替えた時、後からクリックした生徒の描画より先にクリックした生徒の描画(非同期の
      // データ取得を挟むため完了タイミングが前後することがある)が遅れて完了し、画面を上書きしてしまう
      // 不具合があったため、「今の描画がまだ最新のリクエストか」を世代番号で確認できるようにする
      container._renderGen = (container._renderGen || 0) + 1;
      var myRenderGen = container._renderGen;

      try {
        renderBody(container, coachSelectedStudent, selectorHtml, myRenderGen);
      } catch (renderErr) {
        console.error("renderBody エラー", renderErr);
        if (container._renderGen === myRenderGen) {
          container.innerHTML = selectorHtml + '<div class="content"><div class="err-box">表示中にエラーが発生しました:\n' + esc(renderErr && renderErr.message || renderErr) + '</div></div>';
        }
        return;
      }

      // 教室タブ・生徒タグの反応をイベント委任(container自体に1回だけ仕込む)で処理する。
      // renderBody(マイページ等)が生徒データ取得のため非同期に container.innerHTML を
      // 後から丸ごと差し替えることがあり、ボタン個別にonclickを付け直す方式だと
      // その差し替えのタイミング次第でクリックが効かなくなる不具合があったため、
      // container自体に1度だけ仕込んでおけば、中身が何度入れ替わっても効き続ける
      if (!container._selectorDelegated) {
        container._selectorDelegated = true;
        container.addEventListener("click", function(e){
          var sortBtn = e.target.closest("#student-sort-toggle");
          if (sortBtn) {
            coachSortDir = coachSortDir === "asc" ? "desc" : "asc";
            withStudentScope(container, screenTitle, renderBody);
            return;
          }
          var locBtn = e.target.closest(".loc-tab");
          if (locBtn) {
            if (locBtn.hasAttribute("data-lesson-filter")) {
              coachLessonFilterActive = !coachLessonFilterActive;
              withStudentScope(container, screenTitle, renderBody);
              return;
            }
            var v = locBtn.getAttribute("data-loc");
            coachSelectedLocation = v === "" ? null : v;
            coachLessonFilterActive = false;
            withStudentScope(container, screenTitle, renderBody);
            return;
          }
          var tagBtn = e.target.closest(".student-tag");
          if (tagBtn) {
            var newName = tagBtn.getAttribute("data-name");
            setCoachSelectedStudent(newName);
            // タップした瞬間にタグのハイライトだけ即座に切り替える(データ取得完了を待たず体感速度を上げる)
            var allTags = container.querySelectorAll(".student-tag");
            for (var ti = 0; ti < allTags.length; ti++) allTags[ti].classList.remove("on");
            tagBtn.classList.add("on");
            withStudentScope(container, screenTitle, renderBody);
          }
        });
        container.addEventListener("input", function(e){
          if (e.target && e.target.id === "student-search") {
            if (e.isComposing) return; // 変換中は無視
            coachStudentSearch = e.target.value;
            withStudentScope(container, screenTitle, renderBody);
          }
        });
        container.addEventListener("compositionend", function(e){
          if (e.target && e.target.id === "student-search") {
            coachStudentSearch = e.target.value;
            withStudentScope(container, screenTitle, renderBody);
          }
        });
      }
      // カーソル位置を保つため、末尾にフォーカスを戻す(検索欄が再描画された直後のみ)
      var searchInputNow = document.getElementById("student-search");
      if (searchInputNow && document.activeElement !== searchInputNow && coachStudentSearch) {
        searchInputNow.focus();
        searchInputNow.setSelectionRange(searchInputNow.value.length, searchInputNow.value.length);
      }
      // 選択中の生徒タグが常に一覧の先頭(遠藤洋平など)からしか見えない問題への対応。
      // 選択中のタグが横スクロール上で見えるよう自動でスクロールする
      var selectedTagBtn = container.querySelector(".student-tag.on");
      if (selectedTagBtn) {
        selectedTagBtn.scrollIntoView({ block: "nearest", inline: "center" });
      }
      } // end of finishWithStudentScope
    }, function(e){
      var detail = (e && (e.code || e.message)) ? String(e.code || e.message) : "不明なエラー";
      container.innerHTML = '<div class="content"><div class="err-box">会員一覧の読み込みに失敗しました:\n' + esc(detail) + '\n\n画面を再読み込みしてお試しください。</div></div>';
      console.error("withStudentScope エラー", e);
    });
  }

  function recordCheckin(studentName, cb, location, preFetchedDoc, kana){
    function proceedWithDoc(s){
      if (!s) { s = { id: "st-" + Date.now(), name: studentName, checkins: [], lastCheckinDate: null, location: location }; }
      else if (location) { s.location = location; }
      if (kana) s.kana = kana; // 入力があった時だけ上書き。未入力なら既存のふりがなを維持する
      if (s.lastCheckinDate !== todayKey()) { s.checkins = (s.checkins || []).concat([todayKey()]); s.lastCheckinDate = todayKey(); }
      setJSON(studentDocKey(studentName), s);
      invalidateStudentsListCache();
      cb();
    }
    // ログイン処理側で既に生徒ドキュメントを取得済みの場合は、二重に読みに行かず使い回す
    // (Firestoreへの往復を1回減らし、ログインの体感速度を上げるため)
    if (preFetchedDoc !== undefined) { proceedWithDoc(preFetchedDoc); return; }
    getFreshJSON(studentDocKey(studentName), null, proceedWithDoc);
  }

  /* ================= SHELL ================= */
  function renderShell(){
    var tabs = isStaff()
      ? [{ id: "lesson", label: "レッスン" }, { id: "mypage", label: "マイページ" }, { id: "feed", label: "レッスンノート" }, { id: "chat", label: "チャット" }, { id: "roster", label: "会員管理" }]
      : [{ id: "mypage", label: "マイページ" }, { id: "feed", label: "レッスンノート" }, { id: "chat", label: "チャット" }];

    var navHtml = tabs.map(function(t){
      return '<button class="navitem ' + (tab === t.id ? "active" : "") + '" data-tab="' + t.id + '"><span>' + t.label + '</span></button>';
    }).join("");

    root.innerHTML =
      '<div class="phone">' +
        '<div class="fab-stack">' +

  function openPinChangeSheet(){
    document.getElementById("pin-current").value = "";
    document.getElementById("pin-new").value = "";

  function wireFontScaleButtons(){
    var row = document.getElementById("font-scale-row");
    if (!row) return;
    row.querySelectorAll(".font-scale-btn").forEach(function(btn){
      btn.onclick = function(){
        var scaleClass = btn.getAttribute("data-scale");
        try { localStorage.setItem(FONT_SCALE_KEY, scaleClass); } catch (e) { console.error("文字サイズの保存失敗", e); }
        applyFontScale(scaleClass);
        // ボタンの見た目(選択中ハイライト)だけ即座に更新する。画面全体を再描画すると
        // 開いていたシートごと閉じてしまうため、ここではDOM操作のみで済ませる
        row.querySelectorAll(".font-scale-btn").forEach(function(b){
          var on = b === btn;
          b.classList.toggle("on", on);
          b.style.background = on ? "var(--turf)" : "var(--card)";
          b.style.color = on ? "#0a0d08" : "var(--ink)";
        });
      };
    });

  function wirePinChangeSheet(){
    var curInput = document.getElementById("pin-current");
    var newInput = document.getElementById("pin-new");
    var saveBtn = document.getElementById("pin-change-save");
    var cancelBtn = document.getElementById("pin-change-cancel");
    var closeBtn = document.getElementById("pin-sheet-close");
    var errBox = document.getElementById("pin-change-error");
    if (closeBtn) closeBtn.onclick = function(){ toggleSheet("pin-sheet", false); };

    function digitsOnly(e){ e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); updateSave(); }
    function updateSave(){ saveBtn.disabled = !(curInput.value.length === 4 && newInput.value.length === 4); }
    curInput.oninput = digitsOnly;
    newInput.oninput = digitsOnly;
    cancelBtn.onclick = function(){ toggleSheet("pin-sheet", false); };
    saveBtn.onclick = function(){
      if (saveBtn.disabled) return;
      var key = session.role === "coach" ? COACH_PIN_KEY : session.role === "admin" ? ADMIN_PIN_KEY : session.name;
      getJSON(USERS_KEY, {}, function(users){
        hashPin(curInput.value).then(function(curHashed){
          if (users[key] !== curHashed && users[key] !== curInput.value) {
            errBox.textContent = "現在のPINが正しくありません。";
            errBox.style.display = "block";
            return;
          }
          hashPin(newInput.value).then(function(newHashed){
            users[key] = newHashed;
            setJSON(USERS_KEY, users);
            toggleSheet("pin-sheet", false);
            alert("PINを変更しました。");
          });
        });
      });
    };

    document.getElementById("pin-sheet-logout").onclick = function(){
      toggleSheet("pin-sheet", false);
      session = null;
      saveSession(null);
      render();
    };
  }

  function wireCoachProfileSheet(){

      var file = photoInput.files[0];

      var firstName = document.getElementById("coach-profile-firstname").value.trim();

      var saveBtn = document.getElementById("coach-profile-save");
      var photoFile = photoInput.files[0];
      saveBtn.disabled = true;
      saveBtn.textContent = "保存中…";
      function finish(photoUrl){
        getFreshJSON(COACH_PROFILE_KEY, null, function(existing){
          var oldPhotoUrl = existing && existing.photoUrl;
          var record = { name: name, photoUrl: photoUrl || (existing && existing.photoUrl) || null };
          setJSON(COACH_PROFILE_KEY, record);
          invalidateCoachProfileCache();
          saveBtn.disabled = false;
          saveBtn.textContent = "保存する";
          if (photoUrl && oldPhotoUrl && oldPhotoUrl !== photoUrl) deleteUploadedFile(oldPhotoUrl);
          toggleSheet("coach-profile-sheet", false);
          alert("コーチ情報を保存しました。");
          render();
        });
      }
      if (photoFile) {
        uploadVideo(photoFile, "coach/profile", finish, function(){
          saveBtn.disabled = false;
          saveBtn.textContent = "保存する";
          errBox.textContent = "写真のアップロードに失敗しました。";
          errBox.style.display = "block";
        });
      } else {
        finish(null);
      }
    };
  }

  function wireStudentFormSheet(){

      var oldName = sheet.dataset.originalName;
      toggleSheet("student-form-sheet", false);
      openRenameSheet(oldName);
    };
    var locBtns = sheet.querySelectorAll(".loc-tag");
    for (var l = 0; l < locBtns.length; l++) {
      locBtns[l].onclick = function(e){

        e.currentTarget.classList.add("on");
      };
    }
    var birthdateInput = document.getElementById("student-form-birthdate");
    var pinInput = document.getElementById("student-form-pin");
    birthdateInput.onchange = function(){
      // 生年月日からPINのデフォルト(MMDD)を自動入力するのは新規登録時のみ。
      // 編集時に生年月日を直しただけで、既存会員のPINが気づかぬうちに書き換わってしまう事故を防ぐ
      if (sheet.dataset.originalName) return;
      var v = birthdateInput.value; // YYYY-MM-DD
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) {
        pinInput.value = v.slice(5, 7) + v.slice(8, 10);
      }
    };
