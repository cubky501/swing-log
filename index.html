    photoInput.onchange = function(){
      var file = photoInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        preview.src = ev.target.result;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    };

    document.getElementById("student-form-cancel").onclick = function(){ toggleSheet("student-form-sheet", false); };

    document.getElementById("student-form-delete").onclick = function(){
      var name = sheet.dataset.originalName || "";
      if (!name) return;
      if (!confirm(name + "様のデータを完全に削除します。\nレッスンノート・チャット・動画もすべて削除され、元には戻せません。\n\n本当によろしいですか?")) return;
      var typed = prompt("確認のため、会員名「" + name + "」を入力してください。");
      if (typed === null) return;
      if (typed.trim() !== name) { alert("入力された名前が一致しなかったため、削除を中止しました。"); return; }
      var delBtn = document.getElementById("student-form-delete");
      delBtn.disabled = true;
      delBtn.textContent = "削除中…";
      deleteStudent(name, function(){
        delBtn.disabled = false;
        delBtn.textContent = "この会員のデータを削除する";
        toggleSheet("student-form-sheet", false);
        alert(name + "様のデータを削除しました。");
        renderRoster(document.getElementById("screen"));
      });
    };

    document.getElementById("student-form-save").onclick = function(){
      var errBox = document.getElementById("student-form-error");
      errBox.style.display = "none";
      var lastName = document.getElementById("student-form-lastname").value.trim();
      var firstName = document.getElementById("student-form-firstname").value.trim();
      if (!lastName || !firstName) { errBox.textContent = "姓・名を入力してください。"; errBox.style.display = "block"; return; }
      var lastKana = normalizeKana(document.getElementById("student-form-lastkana").value);
      var firstKana = normalizeKana(document.getElementById("student-form-firstkana").value);
      if ((lastKana && !isValidHiragana(lastKana)) || (firstKana && !isValidHiragana(firstKana))) {
        errBox.textContent = "ふりがなはひらがなで入力してください。";
        errBox.style.display = "block";
        return;
      }
      var kana = (lastKana + " " + firstKana).trim();
      var pin = pinInput.value;
      var originalName = sheet.dataset.originalName || "";
      if (pin && pin.length !== 4) { errBox.textContent = "PINは4桁で入力するか、空欄のままにしてください。"; errBox.style.display = "block"; return; }
      if (!originalName && !pin) { errBox.textContent = "新規登録時はPINを4桁で入力してください。"; errBox.style.display = "block"; return; }
      var newName = (lastName + " " + firstName).trim();
      var selectedLoc = sheet.querySelector(".loc-tag.on");
      var location = selectedLoc ? selectedLoc.getAttribute("data-loc") : "";
      var bestScore = document.getElementById("student-form-best").value;
      var avgScore = document.getElementById("student-form-avg").value;
      var golfHistory = document.getElementById("student-form-golfhistory").value.trim();
      var avgRounds = document.getElementById("student-form-avgrounds").value.trim();
      var healthNotes = document.getElementById("student-form-health").value.trim();
      var coachNotes = document.getElementById("student-form-coachnotes").value.trim();
      var birthdate = birthdateInput.value;
      var photoFile = photoInput.files[0];

      var saveBtn = document.getElementById("student-form-save");

      function proceedToSave(){
        saveBtn.disabled = true;
        saveBtn.textContent = "保存中…";
        if (photoFile) {
          uploadVideo(photoFile, "students/" + sanitizeKey(newName), function(url){ saveWithPhotoUrl(url); }, function(){
            saveBtn.disabled = false;
            saveBtn.textContent = "保存する";
            errBox.textContent = "写真のアップロードに失敗しました。";
            errBox.style.display = "block";
          });
        } else {
          saveWithPhotoUrl(null);
        }
      }

      if (!originalName) {
        // 新規登録時のみ、同姓同名の既存生徒がいないか確認する(編集時は originalName があるのでスキップ)
        getFreshJSON(studentDocKey(newName), null, function(existingCheck){
          if (existingCheck) {
            if (!confirm(newName + "様は既に登録されています。情報を上書きしますか?")) return;
          }
          proceedToSave();
        });
      } else {
        proceedToSave();
      }

      function saveWithPhotoUrl(photoUrl){
        var lookupName = originalName || newName;
        getFreshJSON(studentDocKey(lookupName), null, function(existing){
          var record = existing ? Object.assign({}, existing) : { id: "st-" + Date.now(), checkins: [], lastCheckinDate: null };
          var oldPhotoUrl = existing ? existing.photoUrl : null;
          record.name = newName;
          record.kana = kana || record.kana || "";
          record.location = location || record.location || "";
          record.birthdate = birthdate || record.birthdate || "";
          record.bestScore = bestScore !== "" ? Number(bestScore) : (record.bestScore != null ? record.bestScore : null);
          record.avgScore = avgScore !== "" ? Number(avgScore) : (record.avgScore != null ? record.avgScore : null);
          record.golfHistory = golfHistory;
          record.avgRounds = avgRounds;
          record.healthNotes = healthNotes;
          record.coachNotes = coachNotes;
          if (photoUrl) record.photoUrl = photoUrl;

          getFreshJSON(USERS_KEY, {}, function(users){
            var newUsers = Object.assign({}, users);
            function finishUsersSave(){
              setJSONBatch([
                { key: studentDocKey(newName), value: record },
                { key: USERS_KEY, value: newUsers }
              ], function(err){
                function finish(){
                  saveBtn.disabled = false;
                  saveBtn.textContent = "保存する";
                  if (err) { errBox.textContent = "保存に失敗しました。もう一度お試しください。"; errBox.style.display = "block"; return; }
                  toggleSheet("student-form-sheet", false);
                  alert(newName + "様の情報を保存しました。");
                  renderRoster(document.getElementById("screen"));
                }
                // 新しい写真に差し替えられた場合、Storage上の古い写真は不要になるので削除する
                if (photoUrl && oldPhotoUrl && oldPhotoUrl !== photoUrl) deleteUploadedFile(oldPhotoUrl);
                if (!err) invalidateStudentsListCache();
                if (!err && originalName && originalName !== newName) {
                  deleteJSONKey(studentDocKey(originalName), finish);
                } else {
                  finish();
                }
              });
            }
            if (pin) {
              // PINが入力されていれば、新しいPINとしてハッシュ化して保存する(新規登録・意図的な変更どちらも)
              hashPin(pin).then(function(hashed){
                if (originalName && originalName !== newName) delete newUsers[originalName];
                newUsers[newName] = hashed;
                finishUsersSave();
              });
            } else {
              // PIN欄が空欄の場合(編集時のみ到達しうる): 既存のPINハッシュ値をそのまま維持する。
              // 氏名を変更した場合も、PINの値自体は変えずに新しい名前のキーへ引き継ぐ
              if (originalName && originalName !== newName && newUsers[originalName] !== undefined) {
                newUsers[newName] = newUsers[originalName];
                delete newUsers[originalName];
              }
              finishUsersSave();
            }
          });
        });
      }
    };
  }


  function parseTsFromId(id, prefix){
    var n = parseInt(String(id).replace(prefix, ""), 10);
    return isNaN(n) ? 0 : n;
  }

  function renderMyPage(container){
    container.innerHTML = '<div class="content"><div class="empty">読み込み中…</div></div>';
    withStudentScope(container, "My Page", function(container, studentName, selectorHtml, myRenderGen){
      var lessonsKey = lessonsKeyFor(studentName);
      var chatKey = chatKeyFor(studentName);
      var planKey = lessonPlanKeyFor(studentName);
      // 生徒を素早く切り替えた際、後から選んだ生徒より先に選んでいた生徒のデータ取得が遅れて完了し、
      // 画面を上書きしてしまわないよう、実際に書き込む直前で「まだ最新の選択か」を確認する
      function isStale(){ return container._renderGen !== myRenderGen; }
      getJSON(studentDocKey(studentName), null, function(studentRecord){
        if (isStale()) return;
        getCoachProfile(function(coachProfile){
          if (isStale()) return;
          getJSON(lessonsKey, [], function(lessons){
            if (isStale()) return;
            getJSON(chatKey, [], function(messages){
              if (isStale()) return;
              getJSON(planKey, null, function(lessonPlan){
                if (isStale()) return;
                try {
                  drawMyPage(container, studentName, lessons, messages, selectorHtml || "", studentRecord, coachProfile, lessonPlan);
                } catch (e) {
                  console.error("drawMyPage エラー", e);
                  if (!isStale()) container.innerHTML = (selectorHtml || "") + '<div class="content"><div class="err-box">マイページの表示中にエラーが発生しました:\n' + esc(e && e.message || e) + '</div></div>';
                }
              });
            });
          }, function(e){
            console.error("レッスン取得エラー", e);
            if (!isStale()) container.innerHTML = (selectorHtml || "") + '<div class="content"><div class="err-box">レッスンデータの読み込みに失敗しました:\n' + esc(e && e.message || e) + '</div></div>';
          });
        });
      }, function(e){
        console.error("生徒情報取得エラー", e);
        if (!isStale()) container.innerHTML = (selectorHtml || "") + '<div class="content"><div class="err-box">会員情報の読み込みに失敗しました:\n' + esc(e && e.message || e) + '</div></div>';
      });
    });
  }

  // ===== レッスンタブ(会員管理から切り離した、レッスン中に使う専用画面) =====
  // 「今回のレッスンに参加する会員を素早く選ぶ」ことだけに特化した画面。
  // 選んだ後の詳細(進捗・AIサマリー等)はマイページ側で「レッスン中」フィルタを使えば見られるので、
  // ここでは重い情報を出さず、選びやすさ(検索・並び替え・教室絞り込み・折り返しグリッド)に絞る。
  var coachLessonSearch = ""; // このタブ専用の検索キーワード
  function renderLessonTab(container){
    container.innerHTML = '<div class="content"><div class="empty">読み込み中…</div></div>';
    listAllStudents(function(students){
      drawLessonSelect(container, students);
    }, function(e){
      console.error("会員一覧取得エラー(レッスンタブ)", e);
      container.innerHTML = '<div class="content"><div class="err-box">会員一覧の読み込みに失敗しました:\n' + esc(e && e.message || e) + '\n\n画面を再読み込みしてお試しください。</div></div>';
    });
  }

  function drawLessonSelect(container, students){
    var locations = LOCATIONS.slice();
    students.forEach(function(s){ if (s.location && locations.indexOf(s.location) === -1) locations.push(s.location); });
    var hasUnassigned = students.some(function(s){ return !s.location; });

    var filtered = students.filter(function(s){
      if (coachSelectedLocation === "__none__") { if (s.location) return false; }
      else if (coachSelectedLocation && (s.location || "") !== coachSelectedLocation) return false;
      if (coachLessonSearch) {
        var kanaNorm = normalizeKana(coachLessonSearch);
        var nameHit = s.name.indexOf(coachLessonSearch) !== -1;
        var kanaHit = kanaNorm && s.kana && s.kana.indexOf(kanaNorm) !== -1;
        if (!nameHit && !kanaHit) return false;
      }
      return true;
    });
    filtered = sortStudentsByKana(filtered, coachSortDir);

    var current = getCurrentLessonStudents();

    var locTabsHtml = '<button type="button" class="loc-tab' + (!coachSelectedLocation ? " on" : "") + '" data-loc="">全員</button>' +
      locations.map(function(loc){ return '<button type="button" class="loc-tab' + (coachSelectedLocation === loc ? " on" : "") + '" data-loc="' + esc(loc) + '">' + esc(loc) + '</button>'; }).join("") +
      (hasUnassigned ? '<button type="button" class="loc-tab' + (coachSelectedLocation === "__none__" ? " on" : "") + '" data-loc="__none__">未設定</button>' : "");

    var chipsHtml = filtered.length === 0
      ? '<div class="empty">該当する会員がいません。</div>'
      : filtered.map(function(s){
          var inLesson = current.indexOf(s.name) !== -1;
          return '<button type="button" class="lesson-chip' + (inLesson ? " on" : "") + '" data-name="' + esc(s.name) + '">' +
            (inLesson ? "✓ " : "") + esc(s.name) +
            (s.location ? '<span class="loc-mini">' + esc(s.location) + '</span>' : '') +
          '</button>';
        }).join("");

    container.innerHTML =
      '<div class="topbar"><div><div class="eyebrow">Lesson</div><div class="h1">今回のレッスン</div>' +
        '<div class="sub">タップして会員を選ぶと、マイページ・ノート・チャットの「レッスン中」タブで絞り込めます。</div>' +
      '</div></div>' +
      '<div class="content" style="padding-left:0;padding-right:0;">' +
        '<div style="padding:0 16px;">' +
          '<div class="kpi-row" style="margin-bottom:14px;">' +
            '<div class="kpi"><div class="num">' + current.length + '</div><div class="lbl">選択中(最大' + CURRENT_LESSON_MAX + '名)</div></div>' +
            '<div class="kpi"><div class="num">' + filtered.length + '</div><div class="lbl">表示中の会員数</div></div>' +
          '</div>' +
          '<div class="student-search-row">' +
            '<input type="text" class="student-search" id="lesson-search" placeholder="会員名・ふりがなで検索" value="' + esc(coachLessonSearch) + '">' +
            '<button type="button" id="lesson-sort-toggle" class="sort-toggle-btn" title="あいうえお順の並び替え">' + (coachSortDir === "asc" ? "あ→ん" : "ん→あ") + '</button>' +
          '</div>' +
          '<div class="loc-tab-row" style="margin-bottom:12px;">' + locTabsHtml + '</div>' +
          (current.length > 0 ? '<button type="button" id="lesson-reset-btn" class="link-btn" style="font-size:12px;margin-bottom:10px;display:block;">選択をリセット(' + current.length + '名)</button>' : "") +
        '</div>' +
        '<div class="lesson-grid">' + chipsHtml + '</div>' +
      '</div>';

    var searchInput = document.getElementById("lesson-search");
    if (searchInput) {
      searchInput.oninput = function(e){
        if (e.isComposing) return;
        coachLessonSearch = e.target.value;
        drawLessonSelect(container, students);
        var f = document.getElementById("lesson-search");
        if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
      };
      searchInput.addEventListener("compositionend", function(e){
        coachLessonSearch = e.target.value;
        drawLessonSelect(container, students);
        var f = document.getElementById("lesson-search");
        if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
      });
    }
    var sortBtn = document.getElementById("lesson-sort-toggle");
    if (sortBtn) sortBtn.onclick = function(){
      coachSortDir = coachSortDir === "asc" ? "desc" : "asc";
      drawLessonSelect(container, students);
    };
    var locBtns = container.querySelectorAll(".loc-tab");
    for (var lt = 0; lt < locBtns.length; lt++) {
      locBtns[lt].onclick = function(ev){
        var v = ev.currentTarget.getAttribute("data-loc");
        coachSelectedLocation = v === "" ? null : v;
        drawLessonSelect(container, students);
      };
    }
    var resetBtn = document.getElementById("lesson-reset-btn");
    if (resetBtn) resetBtn.onclick = function(){
      if (!confirm("今回のレッスン選択をリセットしますか?")) return;
      setCurrentLessonStudents([]);
      coachLessonFilterActive = false;
      drawLessonSelect(container, students);
    };
    var chipBtns = container.querySelectorAll(".lesson-chip");
    for (var cb = 0; cb < chipBtns.length; cb++) {
      chipBtns[cb].onclick = function(ev){
        var name = ev.currentTarget.getAttribute("data-name");
        var list = getCurrentLessonStudents();
        var idx = list.indexOf(name);
        if (idx !== -1) {
          list.splice(idx, 1);
        } else {
          if (list.length >= CURRENT_LESSON_MAX) {
            alert("今回のレッスンは最大" + CURRENT_LESSON_MAX + "名までです。先に誰かを外してください。");
            return;
          }
          list.push(name);
        }
        setCurrentLessonStudents(list);
        drawLessonSelect(container, students);
      };
    }
  }

  // ===== AIサマリー(コメント分析・要約) =====
  // 現時点ではAnthropic APIキー未設定のため、UI/UXのイメージを確認できるモック表示。
  // キー発行後は wireAiSummarySection 内の呼び出し部分を実際のAPI呼び出しに差し替える想定
  function aiSummarySectionHtml(lessonCount){
    if (lessonCount < 3) return ""; // データが少なすぎる段階では意味が薄いので非表示
    return '<div class="ai-summary-card">' +
      '<div class="yardage" style="margin:0 0 6px;"><span class="tick"></span><span class="num">AIサマリー</span><span class="tick"></span></div>' +
      '<div class="hint">レッスンのコメント傾向をAIがまとめます。</div>' +
      '<button id="ai-summary-btn" class="add-btn" style="font-size:12px;">傾向を見る</button>' +
      '<div id="ai-summary-result" style="display:none;"></div>' +
    '</div>';
  }

  // ===== 次回レッスン計画(コーチ入力欄) =====
  // コーチだけが編集でき、会員は保存済みの内容を閲覧のみできる。AIの提案はあくまで叩き台であり、
  // 「保存する」を押すまでは会員には一切見えない(AI提案・下書き中の内容は常にコーチの画面にしか出ない)
  function lessonPlanSectionHtml(lessonCount, lessonPlan, coachProfile){
    var isCoach = isStaff();
    var savedText = (lessonPlan && lessonPlan.text) || "";
    // 保存者名(コーチ/運営)は、チャット・レッスンノートと同じ考え方で表示する。
    // このカードは常に1件しか出ないため、チャットと違って「運営が関わった時だけ」に絞る必要はなく、毎回表示してよい
    var authorSuffix = (lessonPlan && lessonPlan.authorRole)
      ? "(" + esc(lessonPlan.authorRole === "admin" ? "運営" : coachProfile.name) + ")"
      : "";
    var updatedHint = (lessonPlan && lessonPlan.updatedAt)
      ? '<div class="hint" id="lesson-plan-updated" style="margin-top:8px;">最終更新: ' + esc(formatUpdatedAt(lessonPlan.updatedAt)) + authorSuffix + '</div>'
      : "";

    if (!isCoach) {
      // 会員側は、保存済みの計画があれば閲覧のみ表示。無ければカードごと出さない
      if (!savedText) return "";
      return '<div class="ai-summary-card">' +
        '<div class="yardage" style="margin:0 0 6px;"><span class="tick"></span><span class="num">次回のレッスン計画</span><span class="tick"></span></div>' +
        '<div class="tl-quote" style="white-space:pre-line;">' + esc(savedText) + '</div>' +
        updatedHint +
      '</div>';
    }

    // コーチ側: 入力欄・AI提案ボタン・保存ボタン
    // ボタンの活性条件は「レッスン件数が3件以上」かつ「前回AI提案を生成した時点(保存有無に関わらず)より、
    // レッスン記録が増えている」の両方。「生成した瞬間」にロックすることで、保存前に何度も再生成する
    // ことができなくなり、ボタン押下回数がレッスン回数を超えない、という当初の狙い通りの構造になる
    var lessonCountAtSave = (lessonPlan && lessonPlan.lessonCountAtSave) || 0;
    var lessonCountAtGenerate = (lessonPlan && lessonPlan.lessonCountAtGenerate) || 0;
    var gateCount = Math.max(lessonCountAtSave, lessonCountAtGenerate);
    var hasEnoughLessons = lessonCount >= 3;
    var hasNewLessonsSinceGate = lessonCount > gateCount;
    var canGenerate = hasEnoughLessons && hasNewLessonsSinceGate;
    var aiBtnHtml;
    if (!hasEnoughLessons) {
      aiBtnHtml = '<div class="hint" style="margin-bottom:10px;">レッスン記録が3件以上たまると、AIが提案できるようになります。</div>';
    } else if (!canGenerate) {
      aiBtnHtml = '<button type="button" id="lesson-plan-ai-btn" class="add-btn" style="font-size:12px;margin-bottom:6px;" disabled>✨ AIに提案してもらう</button>' +
        '<div class="hint" id="lesson-plan-ai-hint" style="margin-bottom:10px;">前回の提案以降、新しいレッスン記録が増えたら再提案できるようになります。</div>';
    } else {
      aiBtnHtml = '<button type="button" id="lesson-plan-ai-btn" class="add-btn" style="font-size:12px;margin-bottom:10px;">✨ AIに提案してもらう</button>';
    }

    // 前回の生成内容(まだ入力欄にコピーしていないかもしれない)を、画面を開き直しても見失わないよう
    // 保持しておく。ページ再読み込み・タブ切り替え後も「さっきの提案」を確認できるようにするための対応
    var lastGenText = (lessonPlan && lessonPlan.lastGeneratedText) || "";
    var lastGenHtml = (lastGenText && !canGenerate)
      ? '<div id="lesson-plan-ai-result" style="display:block;">' +
          '<div class="ai-summary-body" style="white-space:pre-line;">' + esc(lastGenText) + '</div>' +
          '<button type="button" class="ai-summary-detail-btn" id="lesson-plan-copy-btn">この内容を入力欄にコピー</button>' +
        '</div>'
      : '<div id="lesson-plan-ai-result" style="display:none;"></div>';

    return '<div class="ai-summary-card">' +
      '<div class="yardage" style="margin:0 0 6px;"><span class="tick"></span><span class="num">次回のレッスン計画</span><span class="tick"></span></div>' +
      '<div class="hint">コーチが次回取り組むことをメモできます。保存すると会員にも表示されます。</div>' +
      aiBtnHtml +
      lastGenHtml +
      '<div class="field" style="margin-top:4px;margin-bottom:8px;">' +
        '<textarea id="lesson-plan-input" placeholder="例:\n・グリップは改善傾向のため復習程度に\n・スタンス幅は毎回チェックから始める" style="height:110px;">' + esc(savedText) + '</textarea>' +
      '</div>' +
      '<button type="button" id="lesson-plan-save-btn" class="add-btn" style="font-size:12px;">保存する</button>' +
      updatedHint +
    '</div>';
  }

  function formatUpdatedAt(ts){
    try {
      var d = new Date(ts);
      return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    } catch (e) { return ""; }
  }

  function wireLessonPlanSection(studentName, lessonCount){
    var aiBtn = document.getElementById("lesson-plan-ai-btn");
    var resultEl = document.getElementById("lesson-plan-ai-result");

    function wireCopyBtn(text){
      var copyBtn = document.getElementById("lesson-plan-copy-btn");
      if (copyBtn) copyBtn.onclick = function(){
        var input = document.getElementById("lesson-plan-input");
        if (input) input.value = text;
      };
    }
    // ページを開いた時点ですでに「前回の提案」が表示されている場合(まだ入力欄にコピーしていない状態で
    // 画面を離れて戻ってきた場合など)も、コピーボタンをちゃんと押せるようにしておく
    var existingResultBody = resultEl ? resultEl.querySelector(".ai-summary-body") : null;
    if (existingResultBody) wireCopyBtn(existingResultBody.textContent);

    if (aiBtn) {
      aiBtn.onclick = function(){
        aiBtn.disabled = true;
        aiBtn.textContent = "生成中…";
        var generateNextLessonPlan = httpsCallable(fbFunctions, "generateNextLessonPlan");
        generateNextLessonPlan({ studentName: studentName }).then(function(res){
          var text = res.data.text || "";
          resultEl.innerHTML =
            '<div class="ai-summary-body" style="white-space:pre-line;">' + esc(text) + '</div>' +
            '<button type="button" class="ai-summary-detail-btn" id="lesson-plan-copy-btn">この内容を入力欄にコピー</button>';
          resultEl.style.display = "block";
          wireCopyBtn(text);
          // 生成した時点で、この回の「新しいレッスン記録」分の提案は使い切ったものとしてボタンを非活性にする。
          // ここで保存の有無に関わらずロックすることで、ボタンの押下回数がレッスン回数を超えないようにする
          aiBtn.disabled = true;
          aiBtn.textContent = "✨ AIに提案してもらう";
          if (!document.getElementById("lesson-plan-ai-hint")) {
            var hintEl = document.createElement("div");
            hintEl.id = "lesson-plan-ai-hint";
            hintEl.className = "hint";
            hintEl.style.marginBottom = "10px";
            hintEl.textContent = "前回の提案以降、新しいレッスン記録が増えたら再提案できるようになります。";
            aiBtn.insertAdjacentElement("afterend", hintEl);
          }
          // ページの再読み込み・タブ切り替え後もロック状態が維持されるよう、生成時点のレッスン件数を保存しておく。
          // (会員に見える"text"や"updatedAt"には触れないので、保存前でも書き込んで問題ない)
          var key = lessonPlanKeyFor(studentName);
          var current = dataCache[key] || {};
          setJSON(key, Object.assign({}, current, { lessonCountAtGenerate: lessonCount, lastGeneratedText: text }));
        }).catch(function(e){
          console.error("レッスン計画の提案生成失敗", e);
          aiBtn.disabled = false;
          aiBtn.textContent = "✨ AIに提案してもらう";
          var msg = (e && e.message) ? e.message : "不明なエラー";
          resultEl.innerHTML = '<div class="err-box">提案の生成に失敗しました:\n' + esc(msg) + '</div>';
          resultEl.style.display = "block";
        });
      };
    }

    var saveBtn = document.getElementById("lesson-plan-save-btn");
    if (saveBtn) {
      saveBtn.onclick = function(){
        var input = document.getElementById("lesson-plan-input");
        var text = input ? input.value.trim() : "";
        var key = lessonPlanKeyFor(studentName);
        saveBtn.disabled = true;
        saveBtn.textContent = "保存中…";
        // 保存した時点のレッスン件数を記録しておく。lessonCountAtGenerateは維持したまま
        // (生成のみ・保存のみ、どちらのタイミングでもロックがかかるようにするため)
        // authorRole:誰が保存したか(コーチ/管理者)を、チャット・レッスンノートと同じ考え方で記録しておく
        var current = dataCache[key] || {};
        var payload = Object.assign({}, current, { text: text, updatedAt: Date.now(), lessonCountAtSave: lessonCount, authorRole: session.role });
        setJSON(key, payload);
        // setJSONは保存完了を待たずキャッシュへ即反映する作りのため、UI側も即座に「保存しました」を出してよい
        setTimeout(function(){
          alert("次回のレッスン計画を保存しました。");
          // AI提案ボタンの活性状態を反映するため、マイページ全体を再描画する
          var screen = document.getElementById("screen");
          if (screen) renderMyPage(screen);
        }, 300);
      };
    }
  }

  // AIが返す構造化データ(result)から、簡潔版のHTMLを組み立てる
  function buildAiSummaryShortHtml(result){
    var phasesHtml = (result.phases || []).map(function(p){
      return '<div>' + esc(p.period || "") + (p.summary ? "は" + esc(p.summary) : "") + '。</div>';
    }).join("");
    var pointsHtml = '<ul>' + (result.repeatedPoints || []).map(function(p){
      return '<li>' + esc(p.title || "") + (p.occurrenceNote ? '(' + esc(p.occurrenceNote) + ')' : '') + '</li>';
    }).join("") + '</ul>';
    var progressHtml = '<ul>' + (result.positiveProgressShort || []).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>';
    return '<h4>フェーズ別の傾向</h4>' + phasesHtml +
      '<h4>繰り返し出てくる指摘</h4>' + pointsHtml +
      '<h4>良い進捗</h4>' + progressHtml +
      '<h4>次に見るべきポイント</h4><div>' + esc(result.nextPoints || "") + '</div>';
  }

  // AIが返す構造化データ(result)から、理由まで書いた詳しめ版のHTMLを組み立てる
  function buildAiSummaryDetailHtml(result){
    var phasesHtml = '<ul>' + (result.phases || []).map(function(p){
      return '<li><b>' + esc(p.period || "") + '</b>: ' + esc(p.detail || p.summary || "") + '</li>';
    }).join("") + '</ul>';
    var pointsHtml = '<ol>' + (result.repeatedPoints || []).map(function(p){
      return '<li><b>' + esc(p.title || "") + '</b> — ' + esc(p.detail || "") + '</li>';
    }).join("") + '</ol>';
    return '<h4>フェーズ別の指導内容の変化</h4>' + phasesHtml +
      '<h4>よく繰り返し出てくる指摘</h4>' + pointsHtml +
      '<h4>ポジティブな進捗コメント</h4><div>' + esc(result.positiveProgressDetail || "") + '</div>' +
      '<h4>次に見るべきポイント</h4><div>' + esc(result.nextPoints || "") + '</div>';
  }

  function wireAiSummarySection(studentName){
    var btn = document.getElementById("ai-summary-btn");
    if (!btn) return;
    btn.onclick = function(){
      var resultEl = document.getElementById("ai-summary-result");
      btn.disabled = true;
      btn.textContent = "生成中…";
      var generateAiSummary = httpsCallable(fbFunctions, "generateAiSummary");
      generateAiSummary({ studentName: studentName }).then(function(res){
        var result = res.data.result;
        resultEl.innerHTML =
          '<div class="ai-summary-body">' + buildAiSummaryShortHtml(result) + '</div>' +
          '<button type="button" class="ai-summary-detail-btn" id="ai-summary-detail-btn">詳しく見る</button>' +
          '<div id="ai-summary-detail" style="display:none;"></div>';
        resultEl.style.display = "block";
        btn.textContent = "再生成する";
        btn.disabled = false;
        var detailBtn = document.getElementById("ai-summary-detail-btn");
        detailBtn.onclick = function(){
          var detailEl = document.getElementById("ai-summary-detail");
          var opening = detailEl.style.display === "none";
          if (opening && detailEl.innerHTML === "") {
            detailEl.innerHTML = '<div class="ai-summary-body">' + buildAiSummaryDetailHtml(result) + '</div>';
          }
          detailEl.style.display = opening ? "block" : "none";
          detailBtn.textContent = opening ? "閉じる" : "詳しく見る";
        };
      }).catch(function(e){
        console.error("AIサマリー生成失敗", e);
        btn.disabled = false;
        btn.textContent = "傾向を見る";
        var msg = (e && e.message) ? e.message : "不明なエラー";
        resultEl.innerHTML = '<div class="err-box">サマリーの生成に失敗しました:\n' + esc(msg) + '</div>';
        resultEl.style.display = "block";
      });
    };
  }

  function drawMyPage(container, studentName, lessons, messages, selectorHtml, studentRecord, coachProfile, lessonPlan){
    var questionCount = messages.filter(function(m){ return m.type === "video" && m.from === "student"; }).length;

    // ---- 指摘カテゴリの集計(頻出ポイント・傾向) ----
    // 「良かった点」は課題ではなく前向きな評価なので、この集計(頻出の指摘ポイント)には含めない
    var taggedLessons = lessons.filter(function(l){ return l.issueTag && l.issueTag !== POSITIVE_TAG; });
    var counts = {};
    ISSUE_TAGS.forEach(function(t){ counts[t] = 0; });
    taggedLessons.forEach(function(l){ counts[l.issueTag] = (counts[l.issueTag] || 0) + 1; });
    var sortedTags = ISSUE_TAGS.filter(function(t){ return counts[t] > 0; }).sort(function(a, b){ return counts[b] - counts[a]; });
    var maxCount = sortedTags.length > 0 ? counts[sortedTags[0]] : 0;

    // ---- 良かった点(前向きな評価)のハイライト ----
    var positiveLessons = lessons.filter(function(l){ return l.issueTag === POSITIVE_TAG; })
      .sort(function(a, b){ return parseTsFromId(b.id, "l-") - parseTsFromId(a.id, "l-"); });
    var positiveHtml = positiveLessons.length === 0 ? "" :
      '<div class="positive-highlight">' +
        '<div class="positive-highlight-title">👍 コーチからの高評価ポイント(' + positiveLessons.length + '件)</div>' +
        '<div class="positive-highlight-comment">「' + esc(positiveLessons[0].comment) + '」</div>' +
        '<div class="positive-highlight-date">' + esc(positiveLessons[0].date) + '</div>' +
      '</div>';

    // 直近半分 と 過去半分 で比較して増減の傾向を出す(簡易的な点数化)
    var sortedByTs = taggedLessons.slice().sort(function(a, b){ return parseTsFromId(a.id, "l-") - parseTsFromId(b.id, "l-"); });
    var half = Math.floor(sortedByTs.length / 2);
    var trendHtml = "";
    if (sortedByTs.length >= 4 && sortedTags.length > 0) {
      var olderHalf = sortedByTs.slice(0, half);
      var newerHalf = sortedByTs.slice(half);
      var topTag = sortedTags[0];
      var olderCount = olderHalf.filter(function(l){ return l.issueTag === topTag; }).length;
      var newerCount = newerHalf.filter(function(l){ return l.issueTag === topTag; }).length;
      if (newerCount < olderCount) trendHtml = '<div class="trend-note good">「' + esc(topTag) + '」の指摘は減ってきています(前半' + olderCount + '回→後半' + newerCount + '回)。改善傾向です。</div>';
      else if (newerCount > olderCount) trendHtml = '<div class="trend-note warn">「' + esc(topTag) + '」の指摘が増えています(前半' + olderCount + '回→後半' + newerCount + '回)。重点的に見ていきましょう。</div>';
      else trendHtml = '<div class="trend-note">「' + esc(topTag) + '」の指摘は横ばいです(前半' + olderCount + '回→後半' + newerCount + '回)。</div>';
    }

    // ---- 指摘カテゴリのトレンド折れ線グラフ(トップ1〜2カテゴリ、累積推移) ----
    var trendChartHtml = "";
    if (sortedByTs.length >= 2 && sortedTags.length > 0) {
      var chartTags = sortedTags.slice(0, 2);
      var chartColors = ["var(--turf)", "var(--sand)"];
      var n = sortedByTs.length;
      var chartW = 300, chartH = 96, padL = 4, padR = 4, padT = 8, plotH = chartH - padT - 6;
      var series = chartTags.map(function(tag, si){
        var cum = 0;
        var pts = sortedByTs.map(function(l, i){
          if (l.issueTag === tag) cum++;
          var x = n > 1 ? padL + (i / (n - 1)) * (chartW - padL - padR) : padL;
          return { x: x, cum: cum };
        });
        return { tag: tag, pts: pts, color: chartColors[si] || "var(--ink-dim)" };
      });
      var maxCum = 1;
      series.forEach(function(s){ s.pts.forEach(function(p){ if (p.cum > maxCum) maxCum = p.cum; }); });
      function yFor(cum){ return padT + plotH - (cum / maxCum) * plotH; }
      var polylines = series.map(function(s){
        var d = s.pts.map(function(p){ return p.x.toFixed(1) + "," + yFor(p.cum).toFixed(1); }).join(" ");
        return '<polyline points="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      }).join("");
      var dots = series.map(function(s){
        var last = s.pts[s.pts.length - 1];
        return '<circle cx="' + last.x.toFixed(1) + '" cy="' + yFor(last.cum).toFixed(1) + '" r="2.5" fill="' + s.color + '"/>';
      }).join("");
      var legend = series.map(function(s){
        return '<span class="trend-legend-item"><span class="trend-legend-dot" style="background:' + s.color + '"></span>' + esc(s.tag) + '</span>';
      }).join("");
      trendChartHtml =
        '<div class="yardage"><span class="tick"></span><span class="num">指摘の推移(トップ' + chartTags.length + ')</span><span class="tick"></span></div>' +
        '<div class="trend-chart-wrap">' +
          '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" preserveAspectRatio="none">' + polylines + dots + '</svg>' +
          '<div class="trend-legend">' + legend + '</div>' +
        '</div>';
    }

    var issueStatsHtml = sortedTags.length === 0 ? "" :
      '<div class="yardage"><span class="tick"></span><span class="num">頻出の指摘ポイント</span><span class="tick"></span></div>' +
      '<div class="issue-stats">' +
        sortedTags.map(function(t){
          var pct = maxCount > 0 ? Math.round((counts[t] / maxCount) * 100) : 0;
          return '<div class="issue-stat-row"><span class="issue-stat-label">' + esc(t) + '</span>' +
            '<div class="issue-stat-bar"><div class="issue-stat-fill" style="width:' + pct + '%"></div></div>' +
            '<span class="issue-stat-count">' + counts[t] + '</span></div>';
        }).join("") +
      '</div>' +
      trendHtml +
      trendChartHtml;

    var hasAnyContent = !!(aiSummarySectionHtml(lessons.length) || lessonPlanSectionHtml(lessons.length, lessonPlan, coachProfile) || positiveHtml || issueStatsHtml);
    var emptyStateHtml = hasAnyContent ? "" : '<div class="empty">まだ記録がありません。\nレッスンが増えると、ここに分析や進捗が表示されます。</div>';

    var scoreParts2 = [];
    if (studentRecord && studentRecord.bestScore != null && studentRecord.bestScore !== "") scoreParts2.push("ベスト " + studentRecord.bestScore);
    if (studentRecord && studentRecord.avgScore != null && studentRecord.avgScore !== "") scoreParts2.push("平均 " + studentRecord.avgScore);
    if (studentRecord && studentRecord.golfHistory) scoreParts2.push("ゴルフ歴 " + studentRecord.golfHistory);
    if (studentRecord && studentRecord.avgRounds) scoreParts2.push("年間ラウンド " + studentRecord.avgRounds);
    container.innerHTML =
      '<div class="topbar"><div style="display:flex;align-items:center;gap:10px;">' +
        (studentRecord && studentRecord.photoUrl ? '<div class="avatar" style="width:44px;height:44px;flex:0 0 44px;"><img class="avatar-photo" src="' + esc(studentRecord.photoUrl) + '"></div>' : '') +
        '<div>' +
          '<div class="eyebrow">My Page</div><div class="h1">これまでの記録</div>' +
          '<div class="sub">' + esc(studentName) + ' 様 ／ ' + esc(coachProfile.name) + 'コーチ</div>' +
          (scoreParts2.length > 0 ? '<div class="roster-scores">' + scoreParts2.join(" ／ ") + '</div>' : '') +
        '</div>' +
      '</div></div>' +
      selectorHtml +
      '<div class="content">' +
        '<div class="kpi-row">' +
          '<div class="kpi"><div class="num">' + lessons.length + '</div><div class="lbl">レッスン本数</div></div>' +
          '<div class="kpi"><div class="num">' + questionCount + '</div><div class="lbl">質問した回数</div></div>' +
        '</div>' +
        aiSummarySectionHtml(lessons.length) +
        lessonPlanSectionHtml(lessons.length, lessonPlan, coachProfile) +
        positiveHtml +
        issueStatsHtml +
        emptyStateHtml +
      '</div>';

    wireAiSummarySection(studentName);
    wireLessonPlanSection(studentName, lessons.length);
  }

  /* ================= LESSON FEED ================= */
  function renderFeed(container){
    container.innerHTML = '<div class="content"><div class="empty">読み込み中…</div></div>';
    withStudentScope(container, "Lesson Note", function(container, studentName, selectorHtml, myRenderGen){
      var key = lessonsKeyFor(studentName);
      getCoachProfile(function(coachProfile){
        if (container._renderGen !== myRenderGen) return; // 生徒の切り替えが追い越していたら古い描画は捨てる
        getJSON(key, [], function(loaded){
          if (container._renderGen !== myRenderGen) return;
          drawFeed(container, loaded, studentName, key, selectorHtml || "", coachProfile);
        });
      });
    });
  }

  function drawFeed(container, lessons, studentName, key, selectorHtml, coachProfile){
    var canAdd = isStaff();
    // 履歴が増えても最新のレッスンが一番上に来るよう、表示用に新しい順へ並べ替える
    // (保存されている配列自体の順序やID/削除・編集の紐付けには影響しない)
    var sortedLessons = lessons.slice().sort(function(a, b){ return parseTsFromId(b.id, "l-") - parseTsFromId(a.id, "l-"); });
    var lastFeedDate = null;
    var cardsHtml = sortedLessons.length === 0
      ? '<div class="empty">まだレッスン記録がありません。</div>'
      : sortedLessons.map(function(l, i){
          var vidId = "vid-" + l.id;
          var media = l.videoUrl
            ? '<video id="' + vidId + '" src="' + esc(l.videoUrl) + '" controls playsinline preload="metadata"></video>' +
              '<div class="speed-pill" data-target="' + vidId + '">' +
                '<button data-rate="1" class="on">1x</button>' +
                '<button data-rate="0.5">0.5x</button>' +
                '<button data-rate="0.25">0.25x</button>' +
              '</div>'
            : (l.thumb ? '<img src="' + esc(l.thumb) + '" alt="" onerror="this.style.display=\'none\';this.insertAdjacentHTML(\'afterend\',\'<div class=media-fallback>画像を読み込めませんでした</div>\')">' : '<div class="media-fallback">画像なし</div>');
          // 日付が変わるところにだけ見出しを出す(同じ日付のレッスンが続く間は出さない)
          var dateHeader = l.date !== lastFeedDate
            ? '<div class="tl-date-header"' + (i === 0 ? ' style="margin-top:4px;"' : '') + '><span class="chip">' + esc(l.date) + '</span><span class="tick"></span></div>'
            : '';
          lastFeedDate = l.date;
          return dateHeader +
            '<div class="card">' +
              '<div class="card-media">' + media +
                '<span class="club-tag">' + esc(l.tag) + '</span>' +
                (l.isNew ? '<span class="new-badge">NEW</span>' : '') +
              '</div>' +
              '<div class="card-body">' +
                '<div class="card-row"><span class="coach">' + esc(l.coach) + '</span></div>' +
                '<div class="comment"><span class="label-mini">コーチからのアドバイス</span>' + esc(l.comment) + (l.issueTag ? ' <span class="issue-badge">#' + esc(l.issueTag) + '</span>' : '') + '</div>' +
                (canAdd ? '<div class="item-actions"><button class="item-edit" data-id="' + esc(l.id) + '">編集</button><button class="item-delete" data-id="' + esc(l.id) + '">削除</button></div>' : '') +
              '</div>' +
            '</div>';
        }).join("");

    container.innerHTML =
      '<div class="topbar">' +
        '<div><div class="eyebrow">Lesson Note</div><div class="h1">スイング記録</div><div class="sub">' + (isStaff() ? "会員：" + esc(studentName) : "担当コーチ：" + esc(coachProfile.name)) + ' ／ 全' + lessons.length + '本</div></div>' +
        (canAdd ? '<button id="add-lesson-btn" class="add-btn">＋ 追加</button>' : '') +
      '</div>' +
      selectorHtml +
      '<div class="content">' + cardsHtml + '</div>' +
      (canAdd ? addLessonSheetHtml() : '');

    var pills = container.querySelectorAll(".speed-pill");
    for (var p = 0; p < pills.length; p++) {
      (function(pill){
        var video = document.getElementById(pill.getAttribute("data-target"));
        var btns = pill.querySelectorAll("button");
        for (var b = 0; b < btns.length; b++) {
          btns[b].onclick = function(e){
            var rate = parseFloat(e.currentTarget.getAttribute("data-rate"));
            if (video) video.playbackRate = rate;
            for (var k = 0; k < btns.length; k++) btns[k].classList.remove("on");
            e.currentTarget.classList.add("on");
          };
        }
      })(pills[p]);
    }

    if (canAdd) {
      document.getElementById("add-lesson-btn").onclick = function(){ openLessonSheet(null); toggleSheet("lesson-sheet", true); };
      wireAddLessonSheet(container, lessons, studentName, key, coachProfile);

      var editBtns = container.querySelectorAll(".item-edit");
      for (var e1 = 0; e1 < editBtns.length; e1++) {
        editBtns[e1].onclick = function(ev){
          var id = ev.currentTarget.getAttribute("data-id");
          var l = lessons.filter(function(x){ return x.id === id; })[0];
          if (l) { openLessonSheet(l); toggleSheet("lesson-sheet", true); }
        };
      }
      var delBtns = container.querySelectorAll(".item-delete");
      for (var e2 = 0; e2 < delBtns.length; e2++) {
        delBtns[e2].onclick = function(ev){
          var id = ev.currentTarget.getAttribute("data-id");
          if (!confirm("このレッスン記録を削除しますか?")) return;
          var target = lessons.filter(function(x){ return x.id === id; })[0];
          if (target && target.sizeBytes) addStudentUsage(studentName, -target.sizeBytes);
          if (target && target.videoUrl) deleteUploadedFile(target.videoUrl);
          var next = lessons.filter(function(x){ return x.id !== id; });
          setJSON(key, next);
          renderFeed(container);
        };
      }
    }
  }

  function addLessonSheetHtml(){
    return '<div id="lesson-sheet" class="modal-back hidden"><div class="sheet">' +
      '<div class="sheet-title" id="lesson-sheet-title">レッスン動画を追加</div>' +
      '<div id="lesson-usage-note" class="usage-note"></div>' +
      '<div class="field"><label>動画ファイル</label>' +
        '<div id="lesson-file-drop" class="file-drop">タップして動画を選択(標準カメラで撮影したものでもOK)<input id="lesson-file" type="file" accept="video/*"></div>' +
        '<div class="hint">1本あたり最大' + MAX_FILE_MB + 'MBまで。容量を抑えるコツ: 撮影は10〜20秒程度に短くする / 4K・60fpsではなく1080p・30fpsで撮影する(スロー再生はアプリ側で行うため高フレームレート撮影は不要)。</div>' +
      '</div>' +
      '<div class="field"><label>クラブ・種別タグ</label><input id="lesson-tag" type="text" placeholder="例: アイアン・ラウンドレッスン"></div>' +
      '<div class="field"><label>指摘カテゴリ・良かった点(任意・集計に使われます)</label><div class="issue-tag-row" id="issue-tag-row">' +
        TAG_SELECT_OPTIONS.map(function(t){ return '<button type="button" class="issue-tag' + (t === POSITIVE_TAG ? " issue-tag-positive" : "") + '" data-issue="' + esc(t) + '">' + esc(t) + '</button>'; }).join("") +
      '</div></div>' +
      '<div class="field"><label>コーチからのアドバイス</label><textarea id="lesson-comment" placeholder="会員への一言コメント"></textarea></div>' +
      '<div class="sheet-actions">' +
        '<button id="lesson-cancel" class="btn btn-cancel">キャンセル</button>' +
        '<button id="lesson-save" class="btn btn-save" disabled>追加する</button>' +
      '</div>' +
    '</div></div>';
  }

  var editingLessonId = null;
  var selectedIssueTag = null;
  function openLessonSheet(lesson){
    editingLessonId = lesson ? lesson.id : null;
    selectedIssueTag = lesson ? (lesson.issueTag || null) : null;
    document.getElementById("lesson-sheet-title").textContent = lesson ? "レッスンを編集" : "レッスン動画を追加";
    document.getElementById("lesson-tag").value = lesson ? lesson.tag : "";
    document.getElementById("lesson-comment").value = lesson ? lesson.comment : "";
    var fileDrop = document.getElementById("lesson-file-drop");
    fileDrop.classList.remove("has-file");
    fileDrop.firstChild.textContent = lesson ? "動画を変更する場合のみ選択(任意)" : "タップして動画を選択(標準カメラで撮影したものでもOK)";
    document.getElementById("lesson-file").value = "";
    var issueBtns = document.querySelectorAll("#issue-tag-row .issue-tag");
    for (var it = 0; it < issueBtns.length; it++) {
      issueBtns[it].classList.toggle("on", issueBtns[it].getAttribute("data-issue") === selectedIssueTag);
      issueBtns[it].onclick = function(e){
        var v = e.currentTarget.getAttribute("data-issue");
        selectedIssueTag = (selectedIssueTag === v) ? null : v; // もう一度押すと解除
        var all = document.querySelectorAll("#issue-tag-row .issue-tag");
        for (var i2 = 0; i2 < all.length; i2++) all[i2].classList.toggle("on", all[i2].getAttribute("data-issue") === selectedIssueTag);
      };
    }
    var saveBtn = document.getElementById("lesson-save");
    saveBtn.textContent = lesson ? "保存する" : "追加する";
    saveBtn.disabled = !(lesson && lesson.tag && lesson.comment);
  }

  function wireAddLessonSheet(container, lessons, studentName, key, coachProfile){
    var fileInput = document.getElementById("lesson-file");
    var fileDrop = document.getElementById("lesson-file-drop");
    var tagInput = document.getElementById("lesson-tag");
    var commentInput = document.getElementById("lesson-comment");
    var saveBtn = document.getElementById("lesson-save");
    var cancelBtn = document.getElementById("lesson-cancel");
    var usageNote = document.getElementById("lesson-usage-note");
    var selectedFile = null;

    getStudentUsageMB(studentName, function(usedMB){
      if (usageNote) usageNote.textContent = "保存容量: " + formatMB(usedMB) + " / " + formatMB(STUDENT_CAP_MB) + " 使用中";
    });

    function updateSave(){
      var hasVideo = editingLessonId ? true : !!selectedFile; // 編集時は動画未変更でもOK
      saveBtn.disabled = !(hasVideo && tagInput.value.trim() && commentInput.value.trim());
    }
    fileInput.onchange = function(e){
      var f = e.target.files[0] || null;
      if (f && f.size > MAX_FILE_MB * 1024 * 1024) {
        alert("動画が大きすぎます(上限" + MAX_FILE_MB + "MB)。撮影時間を短くするか、画質設定を下げてもう一度お試しください。");
        e.target.value = "";
        selectedFile = null;
        fileDrop.classList.remove("has-file");
        fileDrop.firstChild.textContent = editingLessonId ? "動画を変更する場合のみ選択(任意)" : "タップして動画を選択(標準カメラで撮影したものでもOK)";
        updateSave();
        return;
      }
      selectedFile = f;
      fileDrop.classList.toggle("has-file", !!selectedFile);
      fileDrop.firstChild.textContent = selectedFile ? ("選択済み: " + selectedFile.name + "(" + formatMB(selectedFile.size / (1024 * 1024)) + ")") : (editingLessonId ? "動画を変更する場合のみ選択(任意)" : "タップして動画を選択(標準カメラで撮影したものでもOK)");
      updateSave();
    };
    tagInput.oninput = updateSave;
    commentInput.oninput = updateSave;
    cancelBtn.onclick = function(){ toggleSheet("lesson-sheet", false); };
    saveBtn.onclick = function(){
      if (saveBtn.disabled) return;
      var tag = tagInput.value.trim(), comment = commentInput.value.trim();

      function finishSave(videoUrl, sizeBytes){
        var next;
        if (editingLessonId) {
          next = lessons.map(function(l){
            return l.id === editingLessonId ? Object.assign({}, l, { tag: tag, comment: comment, issueTag: selectedIssueTag, videoUrl: videoUrl !== undefined ? videoUrl : l.videoUrl, sizeBytes: sizeBytes !== undefined ? sizeBytes : l.sizeBytes }) : l;
          });
        } else {
          // 管理者(運営)が記録した場合は「運営」名義で残す。コーチが記録した場合は今まで通りプロフィール名
          next = [{ id: "l-" + Date.now(), coach: (session.role === "admin" ? "運営" : coachProfile.name), date: todayLabel(), tag: tag, comment: comment, issueTag: selectedIssueTag, thumb: null, videoUrl: videoUrl, sizeBytes: sizeBytes, isNew: true }].concat(lessons);
        }
        setJSON(key, next);
        renderFeed(container);
      }

      function doUpload(){
        saveBtn.disabled = true;
        saveBtn.textContent = "アップロード中…";
        var fileSize = selectedFile.size;
        // 編集時に動画を差し替えた場合の、差し替え前の動画。アップロード成功後にこれを削除しないと、
        // Storage上にゴミとして残り続け、かつ会員の使用容量カウントも二重に加算されたままになってしまう
        var oldEntry = editingLessonId ? lessons.filter(function(l){ return l.id === editingLessonId; })[0] : null;
        uploadVideo(selectedFile, "lessons/" + studentName, function(downloadUrl){
          addStudentUsage(studentName, fileSize);
          if (oldEntry && oldEntry.videoUrl) {
            if (oldEntry.sizeBytes) addStudentUsage(studentName, -oldEntry.sizeBytes);
            deleteUploadedFile(oldEntry.videoUrl);
          }
          finishSave(downloadUrl, fileSize);
        }, function(err){
          saveBtn.disabled = false;
          saveBtn.textContent = editingLessonId ? "保存する" : "追加する";
          alert("動画のアップロードに失敗しました。もう一度お試しください。");
        });
      }

      if (selectedFile) {
        getStudentUsageMB(studentName, function(usedMB){
          var newTotalMB = usedMB + selectedFile.size / (1024 * 1024);
          if (newTotalMB > STUDENT_CAP_MB) {
            alert(esc(studentName) + "様の保存容量が上限(" + formatMB(STUDENT_CAP_MB) + ")に達するためアップロードできません。\n現在: " + formatMB(usedMB) + "\n古いレッスン動画を削除するか、上限の見直しが必要です。");
            return;
          }
          doUpload();
        });
      } else {
        finishSave(undefined);
      }
    };
  }

  /* ================= CHAT ================= */
  function renderChat(container){
    container.innerHTML = '<div class="content"><div class="empty">読み込み中…</div></div>';
    withStudentScope(container, "Chat", function(container, studentName, selectorHtml, myRenderGen){
      // このタブ・この会員向けの描画を始める前に、直前まで張っていた購読(別の会員のもの、
      // または初回読み込み前の古いもの)を必ず解除しておく。これを怠ると会員を切り替えるたびに
      // 購読が積み上がってしまう
      detachChatListener();
      var key = chatKeyFor(studentName);
      getJSON(studentDocKey(studentName), null, function(studentRecord){
        if (container._renderGen !== myRenderGen) return; // 生徒の切り替えが追い越していたら古い描画は捨てる
        getCoachProfile(function(coachProfile){
          if (container._renderGen !== myRenderGen) return;
          getJSON(key, [], function(messages){
            if (container._renderGen !== myRenderGen) return;
            if (isStaff()) markChatReadByCoach(studentName); // 開いた時点で既読にする
            drawChat(container, messages, studentName, key, selectorHtml || "", studentRecord, coachProfile);
            subscribeChatRealtime(container, key, studentName, selectorHtml || "", studentRecord, coachProfile, myRenderGen);
          });
        });
      });
    });
  }

  // チャット画面を開いている間、相手からの新着メッセージをリロード無しで反映するための購読。
  // タブを離れる・会員を切り替える際は必ず detachChatListener() で止める(このタブ以外の画面を
  // 誤って上書きしないよう、コールバック内でも tab と renderGen の両方を確認する)
  function subscribeChatRealtime(container, key, studentName, selectorHtml, studentRecord, coachProfile, myRenderGen){
    activeChatUnsub = onSnapshot(doc(db, "appState", sanitizeKey(key)), function(snap){
      if (tab !== "chat" || container._renderGen !== myRenderGen) return; // 別画面・別会員に移動済みなら何もしない
      var value = (snap.exists() && snap.data().value !== undefined)
        ? (function(){ try { return JSON.parse(snap.data().value); } catch (e) { return []; } })()
        : [];
      // 自分がsetJSON()で送った直後の書き込みにも、自分自身の購読が反応してもう一度描画が走る。
      // 内容が変わっていなければ再描画しない(入力中のテキストが消えるのを無駄に避ける)
      if (JSON.stringify(dataCache[key]) === JSON.stringify(value)) return;
      dataCache[key] = value;
      if (isStaff()) markChatReadByCoach(studentName);
      // 入力中の下書きテキストは、相手からの新着で画面が再描画されても消えないよう保持する
      var textInputEl = document.getElementById("chat-text");
      var draftText = textInputEl ? textInputEl.value : "";
      drawChat(container, value, studentName, key, selectorHtml, studentRecord, coachProfile);
      if (draftText) {
        var newTextInputEl = document.getElementById("chat-text");
        var newSendBtn = document.getElementById("chat-send");
        if (newTextInputEl) newTextInputEl.value = draftText;
        if (newSendBtn) newSendBtn.disabled = !(draftText.trim().length > 0);
      }
    }, function(err){
      console.error("チャットのリアルタイム購読エラー", err);
    });
  }

  function drawChat(container, messages, studentName, key, selectorHtml, studentRecord, coachProfile){
    // 送信者ごとのアイコン(生徒・コーチ・管理者(運営)とも、登録写真があればそれ、無ければ頭文字)
    function avatarHtml(m){
      if (m.from === "student" && studentRecord && studentRecord.photoUrl) {
        return '<div class="chat-avatar"><img src="' + esc(studentRecord.photoUrl) + '"></div>';
      }
      if (m.authorRole === "admin") {
        return '<div class="chat-avatar">運</div>';
      }
      if (m.from === "coach" && coachProfile.photoUrl) {
        return '<div class="chat-avatar"><img src="' + esc(coachProfile.photoUrl) + '"></div>';
      }
      var initial = m.from === "student" ? studentName[0] : coachProfile.name[0];
      return '<div class="chat-avatar">' + esc(initial) + '</div>';
    }
    var viewerIsStaff = isStaff();
    // このチャットに運営(管理者)が一度でも投稿していた場合だけ、スタッフ側の発言に投稿者名
    // (平山/運営)を表示する。運営が一度も関わっていないチャット(大半のケース)では、
    // 今まで通りラベル無しのすっきりした見た目のままにする
    var threadHasAdminMessage = messages.some(function(msg){ return msg.authorRole === "admin"; });
    var lastDay = null;
    var bodyHtml = messages.length === 0
      ? '<div class="empty">まだメッセージがありません。</div>'
      : messages.map(function(m){
          var msgIsStaff = m.from === "coach"; // fromは表示位置専用に正規化済み("coach"=スタッフ側)
          // 吹き出しの左右は「スタッフ側かどうか」で決める。コーチが見ても管理者が見ても、
          // 相手が会員なら会員が左・スタッフ(自分含む)は右、という同じ並びになる
          var side = (viewerIsStaff === msgIsStaff) ? "me" : "coach";
          // 編集・削除は、実際にその投稿を書いた本人(コーチ or 管理者、それぞれ別人格として)だけに許可する。
          // authorRoleが無い古いメッセージはfromをそのまま実際の投稿者とみなす(後方互換)
          var actualAuthor = m.authorRole || m.from;
          var mine = actualAuthor === session.role;
          // スタッフ側(コーチ/管理者)のメッセージの投稿者名。運営が一度でも関わったチャットでのみ表示する
          var authorLabelHtml = (msgIsStaff && threadHasAdminMessage)
            ? '<div class="tl-dim" style="margin:0 4px 2px;">' + esc(m.authorRole === "admin" ? "運営" : coachProfile.name) + '</div>'
            : "";
          var dayHtml = "";
          if (m.day !== lastDay) { dayHtml = '<div class="day-div">' + esc(m.day) + '</div>'; lastDay = m.day; }
          var actionsHtml = mine
            ? '<div class="msg-actions ' + (side === "coach" ? "left" : "right") + '">' +
                (m.type === "text" ? '<button class="msg-edit" data-id="' + esc(m.id) + '">編集</button>' : '') +
                '<button class="msg-delete" data-id="' + esc(m.id) + '">削除</button>' +
              '</div>'
            : "";
          var rowInner;
          if (m.type === "text") {
            rowInner = authorLabelHtml + '<div class="bubble ' + side + '" data-id="' + esc(m.id) + '">' + esc(m.text) + '</div>' +
              '<div class="bubble-meta ' + (side === "coach" ? "left" : "right") + '">' + esc(m.time) + '</div>' + actionsHtml;
          } else {
            rowInner = authorLabelHtml + '<div class="video-bubble">' +
                '<video src="' + esc(m.videoUrl) + '" controls playsinline preload="metadata"></video>' +
                '<span class="pill">質問動画</span>' +
              '</div>' +
              (m.caption ? '<div class="bubble ' + side + '" data-id="' + esc(m.id) + '">' + esc(m.caption) + '</div>' : "") +
              '<div class="bubble-meta ' + (side === "coach" ? "left" : "right") + '">' + esc(m.time) + '</div>' + actionsHtml;
          }
          return dayHtml +
            '<div class="msg-row ' + side + '">' + avatarHtml(m) + '<div class="msg-stack">' + rowInner + '</div></div>';
        }).join("");

    container.innerHTML =
      '<div class="topbar"><div style="display:flex;align-items:center;gap:10px;">' +
        (isStaff()
          ? (studentRecord && studentRecord.photoUrl
              ? '<div class="avatar" style="width:32px;height:32px;flex:0 0 32px;"><img class="avatar-photo" src="' + esc(studentRecord.photoUrl) + '"></div>'
              : '<div class="avatar" style="width:32px;height:32px;flex:0 0 32px;">' + esc(studentName[0]) + '</div>')
          : (coachProfile.photoUrl
              ? '<div class="avatar" style="width:32px;height:32px;flex:0 0 32px;"><img class="avatar-photo" src="' + esc(coachProfile.photoUrl) + '"></div>'
              : '<div class="avatar" style="width:32px;height:32px;flex:0 0 32px;">' + esc(coachProfile.name[0]) + '</div>')) +
        '<div style="font-size:14px;font-weight:700;">' + (isStaff() ? esc(studentName) + " 様" : esc(coachProfile.name) + " コーチ") + '</div>' +
      '</div></div>' +
      selectorHtml +
      '<div id="chat-scroll" class="content chat-body">' + bodyHtml + '</div>' +
      '<div id="chat-file-chip"></div>' +
      '<div class="inputbar">' +
        '<div id="attach-btn" class="attach-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><input id="chat-file" type="file" accept="video/*"></div>' +
        '<input id="chat-text" placeholder="' + (isStaff() ? "会員へ返信する…" : "メッセージ・質問動画を送る") + '">' +
        '<button id="chat-send" class="send-btn" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="#0a0d08"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></button>' +
      '</div>';

    // 未読ドットは選択と同時に(既読処理の完了を待たず)その場で消しておく。
    // このタイミングでは selectorHtml が「まだ未読だった時点」のまま描画されているため、
    // ここで直接DOM操作して消しておかないと、次にもう一度この画面を再描画するまで残ってしまう
    if (isStaff()) {
      var currentTagBtn = container.querySelector('.student-tag[data-name="' + CSS.escape(studentName) + '"]');
      var dotEl = currentTagBtn && currentTagBtn.querySelector(".unread-dot");
      if (dotEl) dotEl.remove();
    }

    var scrollEl = document.getElementById("chat-scroll");
    // ページ全体が自然スクロールする作りのため、開いた瞬間に必ず最新メッセージ(一番下)まで
    // 確実にスクロールする。動画サムネイルの読み込みで後から高さが変わることがあるため、
    // 初回だけでなくレイアウトが落ち着いた後・動画のメタデータ読み込み後にも再度スクロールする
    function scrollChatToBottom(){
      window.scrollTo(0, document.body.scrollHeight);
    }
    scrollChatToBottom();
    requestAnimationFrame(function(){ requestAnimationFrame(scrollChatToBottom); });
    setTimeout(scrollChatToBottom, 150);
    var chatVideos = scrollEl.querySelectorAll("video");
    for (var cv = 0; cv < chatVideos.length; cv++) {
      chatVideos[cv].addEventListener("loadedmetadata", scrollChatToBottom);
    }

    var editBtns = container.querySelectorAll(".msg-edit");
    for (var eb = 0; eb < editBtns.length; eb++) {
      editBtns[eb].onclick = function(ev){
        var id = ev.currentTarget.getAttribute("data-id");
        var m = messages.filter(function(x){ return x.id === id; })[0];
        if (!m) return;
        var newText = prompt("メッセージを編集", m.text);
        if (newText === null) return;
        newText = newText.trim();
        if (!newText) return;
        var next = messages.map(function(x){ return x.id === id ? Object.assign({}, x, { text: newText }) : x; });
        setJSON(key, next);
        drawChat(container, next, studentName, key, selectorHtml, studentRecord, coachProfile);
      };
    }
    var delBtns = container.querySelectorAll(".msg-delete");
    for (var db = 0; db < delBtns.length; db++) {
      delBtns[db].onclick = function(ev){
        var id = ev.currentTarget.getAttribute("data-id");
        if (!confirm("このメッセージを削除しますか?")) return;
        var target = messages.filter(function(x){ return x.id === id; })[0];
        if (target && target.sizeBytes) addStudentUsage(studentName, -target.sizeBytes);
        if (target && target.videoUrl) deleteUploadedFile(target.videoUrl);
        var next = messages.filter(function(x){ return x.id !== id; });
        setJSON(key, next);
        drawChat(container, next, studentName, key, selectorHtml, studentRecord, coachProfile);
      };
    }

    var textInput = document.getElementById("chat-text");
    var sendBtn = document.getElementById("chat-send");
    var fileInput = document.getElementById("chat-file");
    var attachBtn = document.getElementById("attach-btn");
    var fileChip = document.getElementById("chat-file-chip");
    var selectedFile = null;

    function updateSend(){ sendBtn.disabled = !(textInput.value.trim().length > 0 || selectedFile); }
    textInput.oninput = updateSend;
    textInput.onkeydown = function(e){ if (e.key === "Enter") doSend(); };
    fileInput.onchange = function(e){
      var f = e.target.files[0] || null;
      if (f && f.size > MAX_FILE_MB * 1024 * 1024) {
        alert("動画が大きすぎます(上限" + MAX_FILE_MB + "MB)。撮影時間を短くするか、画質設定を下げてもう一度お試しください。");
        e.target.value = "";
        return;
      }
      selectedFile = f;
      attachBtn.classList.toggle("has-file", !!selectedFile);
      fileChip.innerHTML = selectedFile ? ('<div class="file-chip"><span>📹 ' + esc(selectedFile.name) + '(' + formatMB(selectedFile.size / (1024 * 1024)) + ')</span><button id="chat-file-clear">✕</button></div>') : "";
      if (selectedFile) document.getElementById("chat-file-clear").onclick = function(){ selectedFile = null; fileInput.value = ""; attachBtn.classList.remove("has-file"); fileChip.innerHTML = ""; updateSend(); };
      updateSend();
    };
    sendBtn.onclick = doSend;

    function doSend(){
      if (sendBtn.disabled) return;
      var day = todayLabel(), time = nowLabel();
      if (selectedFile) {
        var fileToSend = selectedFile;
        var captionText = textInput.value.trim();
        getStudentUsageMB(studentName, function(usedMB){
          var newTotalMB = usedMB + fileToSend.size / (1024 * 1024);
          if (newTotalMB > STUDENT_CAP_MB) {
            alert("保存容量が上限(" + formatMB(STUDENT_CAP_MB) + ")に達するため送信できません。\n現在: " + formatMB(usedMB));
            return;
          }
          sendBtn.disabled = true;
          textInput.disabled = true;
          uploadVideo(fileToSend, "chat/" + studentName, function(downloadUrl){
            addStudentUsage(studentName, fileToSend.size);
            // from はバブルの左右振り分け専用の値なので、コーチ・管理者どちらが送っても"coach"に正規化する。
            // 実際に誰が書いたかはauthorRoleに別途残し、管理者が書いた分は「運営」名義で表示する
            var entry = { id: "m-" + Date.now(), from: (session.role === "student" ? "student" : "coach"), authorRole: session.role, type: "video", videoUrl: downloadUrl, caption: captionText || null, time: time, day: day, sizeBytes: fileToSend.size };
            var next = messages.concat([entry]);
            setJSON(key, next);
            markChatActivity(studentName, session.role);
            drawChat(container, next, studentName, key, selectorHtml, studentRecord, coachProfile);
          }, function(err){
            sendBtn.disabled = false;
            textInput.disabled = false;
            alert("動画のアップロードに失敗しました。もう一度お試しください。");
          });
        });
      } else {
        var entry = { id: "m-" + Date.now(), from: (session.role === "student" ? "student" : "coach"), authorRole: session.role, type: "text", text: textInput.value.trim(), time: time, day: day };
        var next = messages.concat([entry]);
        setJSON(key, next);
        markChatActivity(studentName, session.role);
        drawChat(container, next, studentName, key, selectorHtml, studentRecord, coachProfile);
      }
    }
  }

  // Wing Noteのスクリーンショットから読み取った遠藤洋平さんのレッスン履歴(2025/11/07〜2026/08/21、計40件)

    // ---- Wing Note Excelファイルの一括取り込み ----
    var excelStagedByStudent = null; // プレビュー確定後、取り込み対象を保持しておく

    function excelSerialToDateStr(n){
      // Excelのシリアル値(1900年1月1日を1とする)を YYYY-MM-DD に変換
      var utcMs = Math.round((n - 25569) * 86400 * 1000);
      var d = new Date(utcMs);
      return d.toISOString().slice(0, 10);
    }
    function extractDateOnly(v){
      if (v == null || v === "") return "";
      if (typeof v === "number") return excelSerialToDateStr(v);
      var s = String(v);
      var m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
      return m ? m[0] : "";
    }
    function cleanWingNoteComment(raw){
      return String(raw)
        .replace(/_x000D_\n?/g, "\n") // Excel由来の壊れた改行記号を実際の改行に戻す
        .replace(/\r?\n+/g, " ")      // 表示上は1行のコメントとして扱う
        .trim();
    }
    // Wing Noteのエクスポート形式(列位置がズレていても見出し文字列で検出する)からレッスン一覧を抽出する
    function parseWingNoteWorkbook(workbook){
      var sheet = workbook.Sheets[workbook.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: true });
      var headerRow = -1, colLast = -1, colFirst = -1, colComment = -1, colDate = -1, colDeleted = -1;
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var li = row.indexOf("生徒名");
        var ci = row.indexOf("コメント");
        if (li !== -1 && ci !== -1) {
          headerRow = i; colLast = li; colFirst = li + 1; colComment = ci;
          colDate = row.indexOf("登録日時");
          colDeleted = row.indexOf("削除日時\n") !== -1 ? row.indexOf("削除日時\n") : row.indexOf("削除日時");
          break;
        }
      }
      if (headerRow === -1) throw new Error("「生徒名」「コメント」の見出しが見つかりませんでした。Wing Noteの利用状況エクスポート形式か確認してください。");
      var out = [];
      for (var r = headerRow + 1; r < rows.length; r++) {
        var row = rows[r];
        var last = row[colLast], first = row[colFirst], comment = row[colComment];
        if (!last || !comment) continue;
        var deleted = colDeleted !== -1 ? row[colDeleted] : "";
        if (deleted && String(deleted).indexOf("NULL") === -1) continue; // 削除済みレコードは除外
        var dateStr = colDate !== -1 ? extractDateOnly(row[colDate]) : "";
        if (!dateStr) continue;
        out.push({
          name: (String(last).trim() + " " + String(first).trim()).trim(),
          date: dateStr,
          comment: cleanWingNoteComment(comment)
        });
      }
      return out;
    }

    function renderExcelPreview(rowsParsed){
      var excludeRaw = document.getElementById("excel-import-exclude").value;
      var excludeNames = excludeRaw.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
      var registeredNames = students.map(function(s){ return s.name; });

      var byStudent = {};
      rowsParsed.forEach(function(r){
        if (excludeNames.indexOf(r.name) !== -1) return;
        if (!byStudent[r.name]) byStudent[r.name] = [];
        byStudent[r.name].push(r);
      });

      var matched = [], skipped = [];
      Object.keys(byStudent).forEach(function(name){
        if (registeredNames.indexOf(name) !== -1) matched.push(name);
        else skipped.push(name);
      });

      excelStagedByStudent = {};
      matched.forEach(function(name){ excelStagedByStudent[name] = byStudent[name]; });

      var matchedCount = matched.reduce(function(sum, n){ return sum + byStudent[n].length; }, 0);
      var skippedCount = skipped.reduce(function(sum, n){ return sum + byStudent[n].length; }, 0);

      var html = '<div class="hint" style="margin-bottom:8px;">取り込み対象: ' + matched.length + '名 / ' + matchedCount + '件</div>';
      if (matched.length > 0) {
        html += '<div style="margin-bottom:10px;">' + matched.map(function(n){ return '<span class="roster-loc" style="margin:0 6px 6px 0;display:inline-block;">' + esc(n) + '(' + byStudent[n].length + '件)</span>'; }).join("") + '</div>';
      }
      if (skipped.length > 0) {
        html += '<div class="hint" style="color:var(--danger);margin-bottom:8px;">未登録のためスキップ: ' + skipped.length + '名 / ' + skippedCount + '件</div>';
        html += '<div style="margin-bottom:10px;">' + skipped.map(function(n){ return '<span class="roster-loc" style="margin:0 6px 6px 0;display:inline-block;opacity:.6;">' + esc(n) + '(' + byStudent[n].length + '件)</span>'; }).join("") + '</div>';
      }
      if (matched.length > 0) {
        html += '<button id="excel-import-commit-btn" class="add-btn" style="font-size:12px;">この内容で取り込む(' + matchedCount + '件)</button>';
      }
      document.getElementById("excel-import-preview").innerHTML = html;

      var commitBtn = document.getElementById("excel-import-commit-btn");
      if (commitBtn) commitBtn.onclick = function(){
        if (!confirm(matched.length + "名・合計" + matchedCount + "件のレッスン記録を取り込みます。よろしいですか?")) return;
        commitBtn.disabled = true;
        commitBtn.textContent = "取り込み中…";
        var names = Object.keys(excelStagedByStudent);
        var doneCount = 0;
        var totalAdded = 0, totalDup = 0;
        names.forEach(function(name){
          var entries = excelStagedByStudent[name].map(function(r, i){
            var d = new Date(r.date + "T12:00:00");
            return {
              id: "l-" + (d.getTime() + i) + "-" + sanitizeKey(name),
              coach: coachProfile.name,
              date: d.toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" }),
              tag: "過去レッスン",
              comment: r.comment,
              issueTag: null,
              thumb: null, videoUrl: null, isNew: false
            };
          });
          getFreshJSON(lessonsKeyFor(name), [], function(existing){
            // 月をまたいだファイルの期間重複などで同じレッスンが二重に取り込まれないよう、
            // 「日付+コメントの内容」が完全に一致するものは既存データとして扱いスキップする
            var existingKeys = {};
            existing.forEach(function(l){ existingKeys[l.date + "||" + l.comment] = true; });
            var newOnes = entries.filter(function(e){ return !existingKeys[e.date + "||" + e.comment]; });
            totalAdded += newOnes.length;
            totalDup += (entries.length - newOnes.length);
            if (newOnes.length > 0) setJSON(lessonsKeyFor(name), existing.concat(newOnes));
            doneCount++;
            if (doneCount === names.length) {
              commitBtn.disabled = false;
              commitBtn.textContent = "取り込み完了";
              alert(totalAdded + "件を取り込みました。" + (totalDup > 0 ? "\n(既存と重複していた" + totalDup + "件はスキップしました)" : ""));
            }
          });
        });
      };
    }

    var excelPreviewBtn = document.getElementById("excel-import-preview-btn");
    if (excelPreviewBtn) excelPreviewBtn.onclick = function(){
      var fileInput = document.getElementById("excel-import-file");
      var file = fileInput.files[0];
      if (!file) { alert("Excelファイルを選択してください。"); return; }
      excelPreviewBtn.disabled = true;

      var reader = new FileReader();
      reader.onload = function(ev){
        try {
          var workbook = XLSX.read(ev.target.result, { type: "array", cellDates: false });
          var rowsParsed = parseWingNoteWorkbook(workbook);
          if (rowsParsed.length === 0) {
            document.getElementById("excel-import-preview").innerHTML = '<div class="hint">取り込めるレッスン記録が見つかりませんでした。</div>';
          } else {
            renderExcelPreview(rowsParsed);
          }
        } catch (e) {
          document.getElementById("excel-import-preview").innerHTML = '<div class="error-note" style="display:block;">読み込みに失敗しました: ' + esc(e.message) + '</div>';
        }
        excelPreviewBtn.disabled = false;
        excelPreviewBtn.textContent = "内容を確認する";
      };
      reader.readAsArrayBuffer(file);
    };
  }

  // ===== 通知タップから、該当のチャット画面へ直接移動する =====
  // アプリが閉じていた場合は、Service Workerがこの形式のURL(?openChat=...&tab=chat)で
  // 新規に開くので、起動時にここを見て該当のチャットへ移動する
  function applyOpenChatFromNotification(studentName){
    if (!session) return;
    tab = "chat";
    if (isStaff() && studentName) setCoachSelectedStudent(studentName);
  }
  (function(){
    var params = new URLSearchParams(location.search);
    if (params.get("tab") === "chat") {
      applyOpenChatFromNotification(params.get("openChat") || "");
      // 一度処理したらURLから消しておく(再読み込みのたびに毎回チャットへ飛ばされないように)
      history.replaceState(null, "", location.pathname);
    }
  })();

  // シート(PIN変更・会員登録など)の背景の暗い部分をタップした時に、そのシートを閉じる。
  // 「キャンセル」ボタンまで指を運ばなくても閉じられるようにするための対応。
  // シート自体は毎回作り直されるが、documentに1回だけ仕込んでおけばイベント委任で効き続ける
  document.addEventListener("click", function(e){
    if (e.target && e.target.classList && e.target.classList.contains("modal-back") && e.target.id) {
      toggleSheet(e.target.id, false);
    }
  });

  render();
  if (session && session.role === "student") recordCheckin(session.name, function(){});
  setupForegroundNotifications();
  // アプリを新しく起動した場合(通知をタップして開いた場合など)は「裏から前面に戻ってきた」という
  // 変化が発生しないため、visibilitychangeのイベントが一度も起きずバッジが消えないことがあった。
  // 起動した瞬間に必ず1回、無条件でバッジをクリアしておく
  if ("clearAppBadge" in navigator) navigator.clearAppBadge().catch(function(){});

  // アプリを開いたまま(裏で動いている状態)で通知をタップした場合は、Service Workerから
  // postMessageでここに直接届く
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", function(event){
      if (event.data && event.data.type === "openChat") {
        applyOpenChatFromNotification(event.data.studentName || "");
        render();
      }
    });
  }

  // ===== 更新チェック(ホーム画面ショートカット対策) =====
  // iPhoneでホーム画面に追加したアプリは、開き直した時に「新しく読み込む」のではなく
  // 「前回開いた時のまま再開する」挙動になりやすく、デプロイした最新版が反映されないことがある。
  // 画面がアクティブに戻ったタイミングで、サーバー上の最新HTMLに書かれているBUILD_TAGを
  // 裏側で取得して今の画面のものと比較し、違っていたら更新を促すバナーを出す。
  var updateCheckInFlight = false;
  function checkForUpdate(){
    if (updateCheckInFlight) return;
    updateCheckInFlight = true;
    fetch(location.href, { cache: "no-store" })
      .then(function(res){ return res.text(); })
      .then(function(html){
        var m = html.match(/var BUILD_TAG = "([^"]+)"/);
        if (m && m[1] && m[1] !== BUILD_TAG && !document.getElementById("update-banner")) {
          var banner = document.createElement("div");
          banner.id = "update-banner";
          banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9998;background:var(--turf);color:#0a0d08;font-weight:700;font-size:13px;padding:10px 16px;text-align:center;padding-top:calc(10px + env(safe-area-inset-top));";
          banner.textContent = "新しいバージョンがあります。タップして更新";
          banner.onclick = function(){ location.reload(); };
          document.body.appendChild(banner);
        }
      })
      .catch(function(){ /* 通信できない時は何もしない */ })
      .finally(function(){ updateCheckInFlight = false; });
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") {
      checkForUpdate();
      if ("clearAppBadge" in navigator) navigator.clearAppBadge().catch(function(){});
    }
  });
  window.addEventListener("pageshow", function(){ checkForUpdate(); });

  // ===== プルダウンで再読み込み =====
  // 画面の一番上でさらに下へ引っ張り、指を離すとページ全体をリロードする。
  // データやキャッシュが古いまま画面が固まってしまった時、アプリスイッチャーから
  // 閉じ直さなくても直せるようにするための簡易的な避難策
  (function(){
    var PULL_THRESHOLD = 70; // これ以上引っ張ったらリロード実行
    var startY = null, tracking = false, lastDy = 0, indicatorEl = null;

    function ensureIndicator(){
      if (indicatorEl) return indicatorEl;
      indicatorEl = document.createElement("div");
      indicatorEl.id = "pull-refresh-indicator";
      document.body.appendChild(indicatorEl);
      return indicatorEl;
    }

    document.addEventListener("touchstart", function(e){
      // 入力フォーム(シート)が開いている間や、画面が最上部でない時は何もしない
      // (フォーム内をスクロールしただけでリロードされて入力中の内容が消えると困るため)
      if (document.querySelector(".modal-back:not(.hidden)")) { tracking = false; return; }
      if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) { tracking = false; return; }
      if (e.touches.length !== 1) { tracking = false; return; }
      startY = e.touches[0].clientY;
      tracking = true;
      lastDy = 0;
    }, { passive: true });

    document.addEventListener("touchmove", function(e){
      if (!tracking || startY == null) return;
      var dy = e.touches[0].clientY - startY;
      if (dy <= 0) { lastDy = 0; if (indicatorEl) { indicatorEl.style.height = "0px"; indicatorEl.classList.remove("ready"); } return; }
      lastDy = dy;
      var el = ensureIndicator();
      el.style.height = Math.min(dy * 0.4, 60) + "px";
      el.classList.toggle("ready", dy >= PULL_THRESHOLD);
    }, { passive: true });

    document.addEventListener("touchend", function(){
      if (!tracking) return;
      tracking = false;
      if (lastDy >= PULL_THRESHOLD) {
        if (indicatorEl) indicatorEl.classList.add("loading");
        location.reload();
      } else if (indicatorEl) {
        indicatorEl.style.height = "0px";
        indicatorEl.classList.remove("ready");
      }
      startY = null;
      lastDy = 0;
    }, { passive: true });
    document.addEventListener("touchcancel", function(){
      tracking = false;
      startY = null;
      lastDy = 0;
      if (indicatorEl) { indicatorEl.style.height = "0px"; indicatorEl.classList.remove("ready"); }
    }, { passive: true });
  })();
</script>
</body>
</html>
